<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07110c;color:#f5f8f5;font:14px system-ui;padding:30px}.panel{background:#102018;border:1px solid #284633;border-radius:14px;padding:18px;margin:15px 0}.btn,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #284633;background:#08150d;color:#fff}.btn{cursor:pointer}.primary{background:#7ee787;color:#06200b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.box{width:min(700px,100%);background:#0b1911;border:1px solid #284633;border-radius:16px;padding:20px}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #284633}.muted{color:#91a799}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><h1>🌱 J2Grows Database</h1><p class="muted">Plant inventory, propagation and sales.</p><div class="actions"><button class="btn primary" onclick="addPlant()">+ Add plant</button><button class="btn" onclick="load()">↻ Refresh</button></div><section class="panel"><h2>Plants</h2><div id="plants">Loading…</div></section><section class="panel"><h2>Sales</h2><div id="sales">Loading…</div></section><div id="modal" class="modal hidden"></div><script>const SUPABASE_URL='https://izsjxfigndqkuarooequ.supabase.co';const SUPABASE_KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let plants=[],sales=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),money=x=>'£'+Number(x||0).toFixed(2);async function load(){const [p,s]=await Promise.all([db.from('plants').select('*').order('created_at',{ascending:false}),db.from('sales').select('*').order('sale_date',{ascending:false})]);if(p.error)return alert('Could not load plants: '+p.error.message);if(s.error)return alert('Could not load sales: '+s.error.message);plants=p.data||[];sales=s.data||[];render()}function render(){$('plants').innerHTML=plants.length?'<table><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Sale</th><th>Status</th><th></th></tr>'+plants.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.species||'')+(p.variety?' · '+esc(p.variety):'')+'</div></td><td>'+esc(p.purchase_source||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.sale_price)+'</td><td>'+esc(p.status)+'</td><td><button class="btn" onclick="editPlant(\''+p.id+'\')">Edit</button> <button class="btn" onclick="moveSale(\''+p.id+'\')">£ Sales</button></td></tr>').join('')+'</table>':'<p class="muted">No plants yet.</p>';$('sales').innerHTML=sales.length?'<table><tr><th>Date</th><th>Plant</th><th>Price</th><th>Buyer</th></tr>'+sales.map(s=>'<tr><td>'+esc(s.sale_date)+'</td><td>'+esc(s.plant_name)+'</td><td>'+money(s.sale_price)+'</td><td>'+esc(s.buyer||'—')+'</td></tr>').join('')+'</table>':'<p class="muted">No completed sales.</p>'}function close(){ $('modal').classList.add('hidden');$('modal').innerHTML=''}function form(p){$('modal').innerHTML='<div class="box"><h2>'+(p.id?'Edit':'Add')+' plant</h2><form onsubmit="save(event,\''+(p.id||'')+'\')"><div class="grid"><div class="field"><label>Name *</label><input id="n" required value="'+esc(p.name||'')+'"></div><div class="field"><label>Species</label><input id="sp" value="'+esc(p.species||'')+'"></div><div class="field"><label>Variety</label><input id="va" value="'+esc(p.variety||'')+'"></div><div class="field"><label>Status</label><select id="st">'+['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>'<option '+(p.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Where did you get it?</label><input id="src" value="'+esc(p.purchase_source||'')+'"></div><div class="field"><label>Cost (£)</label><input id="co" type="number" step="0.01" value="'+esc(p.cost||0)+'"></div><div class="field"><label>Purchase date</label><input id="dt" type="date" value="'+esc(p.purchase_date||'')+'"></div><div class="field"><label>Location</label><input id="loc" value="'+esc(p.location||'')+'"></div><div class="field"><label>Sale price (£)</label><input id="sale" type="number" step="0.01" value="'+esc(p.sale_price||0)+'"></div><div class="field full"><label>Notes</label><textarea id="notes">'+esc(p.notes||'')+'</textarea></div></div><div class="actions"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>';$('modal').classList.remove('hidden')}function addPlant(){form({})}function editPlant(id){form(plants.find(p=>p.id===id)||{})}async function save(e,id){e.preventDefault();const data={name:$('n').value.trim(),species:$('sp').value.trim(),variety:$('va').value.trim(),status:$('st').value,purchase_source:$('src').value.trim(),cost:Number($('co').value||0),purchase_date:$('dt').value||null,location:$('loc').value.trim(),sale_price:Number($('sale').value||0),notes:$('notes').value.trim()};const r=id?await db.from('plants').update(data).eq('id',id):await db.from('plants').insert({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data});if(r.error)return alert('Could not save plant: '+r.error.message);close();load()}async function moveSale(id){const p=plants.find(x=>x.id===id);const v=prompt('Sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');const r=await db.from('plants').update({status:'For Sale',sale_price:price}).eq('id',id);if(r.error)return alert(r.error.message);load()}load();</script></body></html>
