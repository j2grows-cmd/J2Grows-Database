name: Upgrade plant ownership and sales workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Trigger major app upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply major app upgrade
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')

          reps = [
            (".stage{display:grid;grid-template-columns:repeat(5,1fr);", ".stage{display:grid;grid-template-columns:repeat(6,1fr);"),
            ("<div class=\"field\"><label>Where acquired</label><input class=\"input\" id=\"f_source\" value=\"'+esc(p.purchase_source||p.source||'')+'\"></div>", "<div class=\"field\"><label>Where acquired</label><input class=\"input\" id=\"f_source\" value=\"'+esc(p.purchase_source||p.source||'')+'\"></div><div class=\"field\"><label>Ownership</label><select class=\"select\" id=\"f_owner\"><option value=\"Sale\">Sale</option><option value=\"Personal\">Personal</option></select></div>"),
            ("if($('f_health'))$('f_health').value=p.health||'Healthy';if($('f_stage'))$('f_stage').value=p.lifecycle_stage||p.status||'Growing'", "if($('f_health'))$('f_health').value=p.health||'Healthy';if($('f_stage'))$('f_stage').value=p.lifecycle_stage||p.status||'Growing';if($('f_owner'))$('f_owner').value=p.ownership_type||'Sale'"),
            ("const payload={name:$('f_name').value,species:$('f_species').value,variety:$('f_variety').value,purchase_source:$('f_source').value,source:$('f_source').value,cost:Number($('f_cost').value||0),sale_price:Number($('f_sale').value||0)", "const payload={name:$('f_name').value,species:$('f_species').value,variety:$('f_variety').value,purchase_source:$('f_source').value,source:$('f_source').value,ownership_type:$('f_owner').value,cost:Number($('f_cost').value||0),sale_price:Number($('f_sale').value||0)"),
            ("<option>For Sale</option><option>Sold</option>", "<option>For Sale</option><option>Reserved</option><option>Sold</option>"),
            ("+(p.ownership_type==='Sale'&&p.status==='For Sale'?'<button class=\"btn primary\" onclick=\"sellForm(\\'"+"+p.id+\"\\')\">Sell</button>':'')", "+(p.ownership_type==='Sale'&&p.status==='For Sale'?'<button class=\"btn primary\" onclick=\"sellForm(\\''+p.id+'\\')\">Sell</button>':'')+(p.ownership_type==='Sale'&&p.status==='For Sale'?'<button class=\"btn\" onclick=\"reservePlant(\\''+p.id+'\\')\">Reserve</button>':'')+(p.ownership_type==='Sale'&&p.status==='Reserved'?'<button class=\"btn primary\" onclick=\"sellForm(\\''+p.id+'\\')\">Complete Sale</button>':'')"),
            ("async function listPlant(id){try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',lifecycle_stage:'For Sale',listed_at:new Date().toISOString(),moved_to_sales_at:new Date().toISOString()})});await load();profile(id)}catch(e){alert(e.message)}}", "async function listPlant(id){try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',lifecycle_stage:'For Sale',listed_at:new Date().toISOString(),moved_to_sales_at:new Date().toISOString()})});await load();profile(id)}catch(e){alert(e.message)}}async function reservePlant(id){try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'Reserved',lifecycle_stage:'Reserved',reserved_at:new Date().toISOString()})});await load();profile(id)}catch(e){alert('Could not reserve plant: '+e.message)}}"),
            ("const active=plants.filter(p=>p.ownership_type==='Sale'&&p.status==='For Sale'),sold=sales;", "const active=plants.filter(p=>p.ownership_type==='Sale'&&(p.status==='For Sale'||p.status==='Reserved')),sold=sales;"),
            ("['Acquired','Growing','Propagated','For Sale','Sold']", "['Acquired','Growing','Propagated','For Sale','Reserved','Sold']"),
            ("<section class=\"panel\"><h3>Active listings</h3>'+table(active)+'</section>", "<section class=\"panel\"><h3>Active listings</h3><p class=\"sub\">For Sale and Reserved stock. Open a plant to reserve or complete the sale.</p>'+table(active)+'</section>"),
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('pattern not found: '+old[:100])
            s = s.replace(old,new,1)

          marker = "if($('f_owner'))$('f_owner').value=p.ownership_type||'Sale'"
          extra = marker+";if($('f_owner'))$('f_owner').onchange=()=>{const sale=$('f_owner').value==='Sale';$('f_sale').disabled=!sale;if(!sale)$('f_sale').value=0};if($('f_owner'))$('f_owner').dispatchEvent(new Event('change'))"
          s = s.replace(marker,extra,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove upgrade workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/app-major-upgrade.yml
          git add app-v4.html .github/workflows/app-major-upgrade.yml
          git commit -m 'Upgrade plant ownership and sales workflow'
          git push