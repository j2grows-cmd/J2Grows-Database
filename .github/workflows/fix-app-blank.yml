name: Fix blank app
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app-v4.html')
          s=p.read_text(encoding='utf-8')
          marker="let plants=[],sales=[],view='collection',filter='all',q='';const $=id=>document.getElementById(id)"
          if marker in s and "const main=document.getElementById('main');" not in s:
              s=s.replace(marker,"let plants=[],sales=[],view='collection',filter='all',q='';const main=document.getElementById('main');const $=id=>document.getElementById(id)",1)
          p.write_text(s,encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/app-scripts.js').write_text('\n'.join(blocks),encoding='utf-8')
      - name: Validate JavaScript
        run: node --check /tmp/app-scripts.js
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.html
          git diff --cached --quiet || git commit -m 'Fix blank app render target'
          git rm .github/workflows/fix-app-blank.yml
          git commit -m 'Remove temporary blank app fix workflow'
          git push
