name: Fix modal close button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix modal close handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('ownership.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('onclick=\"close()\"', 'onclick=\"closeModal()\"')
          s = s.replace('function close(){$(\'modal\').classList.add(\'hidden\');$(\'modal\').innerHTML=\'\'}', "function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}")
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ownership.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix plant profile modal close button'
          git push