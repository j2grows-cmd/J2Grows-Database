name: Inject workspace settings
on:
  push:
    branches: [main]
    paths:
      - 'settings.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject settings script
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="settings.js"></script>'
          anchor = '<script src="auth.js"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('Auth script anchor not found')
              s = s.replace(anchor, anchor + tag, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.html
          git diff --cached --quiet || git commit -m 'Add workspace settings to Command Centre [skip ci]'
          git push
