name: Inject workspace scripts
on:
  push:
    branches: [main]
    paths:
      - 'settings.js'
      - 'dashboard.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject workspace scripts
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')
          anchors = [
              ('<script src="settings.js"></script>', '<script src="auth.js"></script>'),
              ('<script src="dashboard.js"></script>', '<script src="settings.js"></script>'),
          ]
          for tag, anchor in anchors:
              if tag not in s:
                  if anchor not in s:
                      raise SystemExit(f'Anchor not found: {anchor}')
                  s = s.replace(anchor, anchor + tag, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript injection
        shell: bash
        run: |
          grep -q '<script src="dashboard.js"></script>' app-v4.html
          grep -q '<script src="settings.js"></script>' app-v4.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.html
          git diff --cached --quiet || git commit -m 'Add premium workspace dashboard [skip ci]'
          git push
