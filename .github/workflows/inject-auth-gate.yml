name: Inject authentication gate
on:
  push:
    branches: [main]
    paths:
      - 'auth.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject auth gate
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="auth.js"></script>'
          if tag not in s:
              s = s.replace('</head>', tag + '</head>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v4.html
          git diff --cached --quiet || git commit -m 'Add account gate to Command Centre [skip ci]'
          git push
