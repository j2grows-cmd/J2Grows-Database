name: Apply critical production app improvements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply critical production app improvements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production app
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-v4.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("async function load(){try{plants=await api('/plants?select=*&order=created_at.desc');sales=await api('/sales?select=*&order=sale_date.desc');render()}catch(e){main.innerHTML=", "async function load(){try{plants=await api('/plants?select=*&order=created_at.desc');sales=await api('/sales?select=*&order=sale_date.desc');nav(view)}catch(e){main.innerHTML="),
            ("const a=['Acquired','Growing','Propagated','For Sale','Sold'];", "const a=['Acquired','Growing','Propagated','For Sale','Reserved','Sold'];"),
            ("((p.name||'').toLowerCase().includes(q)||(p.species||'').toLowerCase().includes(q)||(p.variety||'').toLowerCase().includes(q))", "((p.name||'').toLowerCase().includes(q)||(p.species||'').toLowerCase().includes(q)||(p.variety||'').toLowerCase().includes(q)||(p.plant_code||'').toLowerCase().includes(q)||(p.purchase_source||p.source||'').toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)||(p.notes||'').toLowerCase().includes(q))"),
            ("@media(max-width:480px){.side{display:none}.main{margin:0}.cards{grid-template-columns:1fr}}", "@media(max-width:480px){.side{display:flex;inset:auto 0 0 0;width:100%;height:70px;padding:7px 10px;border-right:0;border-top:1px solid #183722;align-items:center;background:#06100af8;backdrop-filter:blur(14px)}.side .brand{display:none}.nav{display:flex;width:100%;justify-content:space-around;gap:4px}.nav button{flex:1;text-align:center;padding:7px 4px;font-size:11px}.nav button span{display:block;font-size:9px;margin-top:3px}.main{margin:0;padding:18px 14px 92px}.cards{grid-template-columns:1fr}}")]
          for old,new in replacements:
            if old not in s: raise SystemExit('pattern not found: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove this one-shot patch workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/app-critical-improvements.yml
          git add app-v4.html .github/workflows/app-critical-improvements.yml
          git commit -m 'Apply critical production app improvements'
          git push