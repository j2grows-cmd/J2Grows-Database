name: Highlight active navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add active navigation behaviour
        shell: python
        run: |
          from pathlib import Path
          p = Path('ownership.html')
          s = p.read_text(encoding='utf-8')
          old = "function go(v){view=v;render()}"
          new = "function go(v){view=v;document.querySelectorAll('.nav button').forEach(b=>{const active=b.getAttribute('onclick')?.includes(\"go('\"+v+\"')\");b.classList.toggle('active',!!active);b.setAttribute('aria-current',active?'page':'false')});render()}"
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit navigation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ownership.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Highlight current page in sidebar navigation'
          git push
