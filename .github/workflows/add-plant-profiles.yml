name: Add Premium Plant Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-plant-profiles.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject plant profiles into the live app
        shell: python
        run: |
          from pathlib import Path
          p = Path('ownership.html')
          s = p.read_text(encoding='utf-8')
          if 'function profile(id)' in s:
              print('Plant profile already installed.')
              raise SystemExit(0)

          css = r''' .profileHero{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:stretch;margin-bottom:18px}.profilePhoto{min-height:180px;border-radius:18px;border:1px solid #2d4c36;background:linear-gradient(145deg,#102719,#09150e);display:grid;place-items:center;overflow:hidden}.profilePhoto img{width:100%;height:100%;object-fit:cover}.profilePhoto .ph{font-size:56px;opacity:.65}.profileTitle{font-size:30px;font-weight:900;margin:3px 0}.profileId{font:12px ui-monospace,SFMono-Regular,monospace;color:#8fa498}.profileGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.profileCard{background:linear-gradient(180deg,#102118f2,#0b1710f2);border:1px solid #25402e;border-radius:16px;padding:16px}.profileSection{margin-bottom:18px}.profileSection h3{margin:0 0 12px;font-size:15px}.profileFacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{padding:12px;border:1px solid #1b3123;border-radius:12px;background:#09140d}.fact b{display:block;font-size:10px;color:#8fa498;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.timeline{display:grid;gap:9px}.event{display:flex;gap:12px;padding:12px;border-left:2px solid #4ccf70;background:#09140d;border-radius:0 10px 10px 0}.eventDot{font-size:18px}.family{display:grid;grid-template-columns:1fr 1fr;gap:12px}.familyCard{padding:14px;border:1px solid #25402e;border-radius:14px;background:#0d1a12}.familyCard a{color:#8cf39a;text-decoration:none;font-weight:800;cursor:pointer}.profileActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.profileHero{grid-template-columns:1fr}.profileGrid,.profileFacts,.family{grid-template-columns:1fr}}'''
          marker = '</style></head>'
          if marker not in s:
              raise SystemExit('Could not find style boundary')
          s = s.replace(marker, css + marker, 1)

          old = '<td><b>${esc(p.name)}</b><div class="sub">${esc(p.species||\'\')}${p.variety?\' · \'+esc(p.variety):\'\'}</div></td>'
          new = '<td><button class="btn" style="text-align:left" onclick="profile(\'${p.id}\')"><b>${esc(p.name)}</b><div class="sub">${esc(p.species||\'\')}${p.variety?\' · \'+esc(p.variety):\'\'}</div></button></td>'
          if old not in s:
              raise SystemExit('Could not find plant table cell')
          s = s.replace(old, new, 1)

          fn = r'''async function profile(id){
            const p=plants.find(x=>x.id===id); if(!p)return;
            $('modal').innerHTML='<div class="box" id="profileBox"><div class="head"><div><div class="eyebrow">PLANT PROFILE</div><h2 style="margin:3px 0">'+esc(p.name)+'</h2></div><button class="close" onclick="close()">×</button></div><div class="empty">Loading plant history…</div></div>';
            $('modal').classList.remove('hidden');
            let children=[],props=[],plantSales=[];
            try{children=await api('/plants?select=id,name,species,variety,status,ownership_type,cost,sale_price,parent_plant_id&parent_plant_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc')}catch(e){}
            try{props=await api('/propagations?select=*&plant_id=eq.'+encodeURIComponent(id)+'&order=propagated_at.desc')}catch(e){}
            try{plantSales=await api('/sales?select=*&plant_id=eq.'+encodeURIComponent(id)+'&order=sale_date.desc')}catch(e){}
            let parent=p.parent_plant_id?plants.find(x=>x.id===p.parent_plant_id):null;
            let status=p.status==='Sold'?'Sold':p.ownership_type==='Personal'?'Personal':p.status==='For Sale'?'For Sale':'Growing';
            let photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="'+esc(p.name)+'">':'<div class="ph">🌿</div>';
            let events=[];
            if(p.purchase_date)events.push('<div class="event"><div class="eventDot">🛒</div><div><b>Acquired</b><div class="sub">'+esc(p.purchase_date)+' · '+esc(p.purchase_source||p.source||'Source not recorded')+'</div></div></div>');
            props.forEach(x=>events.push('<div class="event"><div class="eventDot">✂️</div><div><b>Propagation · '+esc(x.propagation_type||'Propagation')+'</b><div class="sub">'+esc(x.propagated_at||'')+(x.notes?' · '+esc(x.notes):'')+'</div></div></div>'));
            plantSales.forEach(x=>events.push('<div class="event"><div class="eventDot">💷</div><div><b>Sold for '+money(x.sale_price)+'</b><div class="sub">'+esc(x.sale_date||'')+(x.buyer?' · '+esc(x.buyer):'')+'</div></div></div>'));
            $('profileBox').innerHTML='<div class="head"><div><div class="eyebrow">J2GROWS PLANT PROFILE</div><div class="profileTitle">'+esc(p.name)+'</div><div class="profileId">'+esc(p.plant_code||p.id)+'</div></div><button class="close" onclick="close()">×</button></div>'+
              '<div class="profileHero"><div class="profilePhoto">'+photo+'</div><div class="panel" style="padding:18px"><div>'+pill(p)+'</div><div class="sub" style="margin-top:9px">'+esc(p.species||'Species not recorded')+(p.variety?' · '+esc(p.variety):'')+'</div><div class="profileActions"><button class="btn primary" onclick="close();plantForm(\''+p.id+'\')">Edit plant</button>'+(p.ownership_type==='Sale'&&p.status!=='Sold'?'<button class="btn gold" onclick="close();moveSale(\''+p.id+'\')">£ Sales</button>':'')+'<button class="btn" onclick="close();prop(\''+p.id+'\')">✂ Propagate</button></div></div></div>'+
              '<div class="profileGrid"><div class="profileCard"><div class="label">Acquisition cost</div><div class="metric">'+money(p.cost)+'</div></div><div class="profileCard"><div class="label">Current value</div><div class="metric">'+money(p.current_value)+'</div></div><div class="profileCard"><div class="label">Sale price</div><div class="metric gold">'+(p.ownership_type==='Sale'?money(p.sale_price):'—')+'</div></div><div class="profileCard"><div class="label">Location</div><div class="metric" style="font-size:18px">'+esc(p.location||'Not set')+'</div></div></div>'+
              '<section class="profileSection"><h3>Plant details</h3><div class="profileFacts"><div class="fact"><b>Where acquired</b>'+esc(p.purchase_source||p.source||'Not recorded')+'</div><div class="fact"><b>Health</b>'+esc(p.health||'Healthy')+'</div><div class="fact"><b>Purchase date</b>'+esc(p.purchase_date||'Not recorded')+'</div><div class="fact"><b>Ownership</b>'+esc(p.ownership_type||'Sale')+'</div><div class="fact"><b>Parent plant</b>'+(parent?'<a onclick="profile(\''+parent.id+'\')">'+esc(parent.name)+'</a>':'None — original plant')+'</div><div class="fact"><b>Propagation count</b>'+String(p.propagation_count||props.length||0)+'</div></div>'+(p.notes?'<div class="fact" style="margin-top:10px"><b>Notes</b>'+esc(p.notes)+'</div>':'')+'</section>'+
              '<section class="profileSection"><h3>Family tree</h3><div class="family"><div class="familyCard"><div class="label">Parent</div><p>'+(parent?'<a onclick="profile(\''+parent.id+'\')">🌿 '+esc(parent.name)+'</a>':'🌱 Original plant')+'</p></div><div class="familyCard"><div class="label">Children / cuttings</div>'+ (children.length?children.map(c=>'<p style="margin:7px 0"><a onclick="profile(\''+c.id+'\')">✂️ '+esc(c.name)+'</a><span class="sub"> · '+esc(c.status||'Growing')+'</span></p>').join(''):'<p class="sub">No propagated children recorded.</p>')+'</div></div></section>'+
              '<section class="profileSection"><h3>History</h3><div class="timeline">'+(events.length?events.join(''):'<div class="empty">No history recorded yet.</div>')+'</div></section>';
          }
          s = s.replace('load();</script></body></html>', fn + 'load();</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
          print('Premium plant profiles injected.')
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ownership.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add premium plant profile views [skip ci]"
          git push
