<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110b"><title>J2Grows · Collection</title><style>:root{--bg:#06100a;--panel:#0d1a12;--panel2:#112319;--line:#25402e;--text:#f3f8f3;--muted:#8fa498;--green:#8cf39a;--gold:#e8c86b;--blue:#79bdff;--red:#ff8178}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1b492a,transparent 60%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:240px;position:fixed;height:100vh;padding:22px 14px;background:#07110de8;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900;padding:5px 10px 30px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#caffd0,#40c96a);color:#06210b;font-size:21px}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:#14281b;border-color:#254630;color:var(--text)}.main{margin-left:240px;width:calc(100% - 240px);padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.16em}.title{font-size:34px;font-weight:900;margin:4px 0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0e1b13;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn:hover{border-color:#41634a;background:#14281b}.primary{background:linear-gradient(135deg,#9bffaa,#56d878);color:#06210b;border-color:transparent}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#0d1a12;color:var(--muted);cursor:pointer;font-weight:800}.tab.active{color:#06210b;background:var(--green);border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:linear-gradient(180deg,#102118f2,#0b1710f2);border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 70px #0006}.card{padding:17px}.label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.11em;text-transform:uppercase}.metric{font-size:28px;font-weight:900;margin-top:5px}.green{color:var(--green)}.gold{color:var(--gold)}.blue{color:var(--blue)}.panel{padding:17px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 9px;border-bottom:1px solid #1b3123;text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.pill.personal{background:#102d46;color:#9fd0ff}.pill.sale{background:#302713;color:#f4d884}.pill.sold{background:#351d1d;color:#ffaaa4}.pill.growing{background:#173622;color:#aaf3b5}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:10}.modal.hidden{display:none}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0a1710;border:1px solid #2d4c36;border-radius:18px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.close{border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.input,.select,.textarea{background:#07110b;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:10px;outline:none}.textarea{min-height:100px;resize:vertical}.ownership{display:grid;grid-template-columns:1fr 1fr;gap:9px}.own{border:1px solid var(--line);background:#09140d;padding:14px;border-radius:12px;cursor:pointer}.own.selected.personal{border-color:var(--blue);background:#0d2335}.own.selected.sale{border-color:var(--gold);background:#292313}.own b{display:block;margin-bottom:4px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:900px){.side{width:72px}.brand span,.nav span{display:none}.brand{justify-content:center}.main{margin-left:72px;width:calc(100% - 72px)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.side{display:none}.main{margin:0;width:100%;padding:16px}.cards,.form{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column}.ownership{grid-template-columns:1fr}}
.profileHero{display:grid;grid-template-columns:180px 1fr;gap:22px;margin-bottom:18px}.profilePhoto{min-height:180px;border-radius:18px;border:1px solid #2d4c36;background:linear-gradient(145deg,#102719,#09150e);display:grid;place-items:center;overflow:hidden}.profilePhoto img{width:100%;height:100%;object-fit:cover}.profilePhoto .ph{font-size:56px;opacity:.65}.profileTitle{font-size:30px;font-weight:900}.profileId{font:12px ui-monospace,SFMono-Regular,monospace;color:#8fa498}.profileGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.profileCard{background:linear-gradient(180deg,#102118f2,#0b1710f2);border:1px solid #25402e;border-radius:16px;padding:16px}.profileSection{margin-bottom:18px}.profileSection h3{margin:0 0 12px;font-size:15px}.profileFacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{padding:12px;border:1px solid #1b3123;border-radius:12px;background:#09140d}.fact b{display:block;font-size:10px;color:#8fa498;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.timeline{display:grid;gap:9px}.event{display:flex;gap:12px;padding:12px;border-left:2px solid #4ccf70;background:#09140d;border-radius:0 10px 10px 0}.family{display:grid;grid-template-columns:1fr 1fr;gap:12px}.familyCard{padding:14px;border:1px solid #25402e;border-radius:14px;background:#0d1a12}.familyCard a{color:#8cf39a;text-decoration:none;font-weight:800;cursor:pointer}.profileActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.profileHero,.profileGrid,.profileFacts,.family{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">🌱</div><span>J2Grows</span></div><nav class="nav"><button class="active" onclick="go('collection')">🌿 <span>Collection</span></button><button onclick="go('sales')">£ <span>Sales</span></button><button onclick="go('prop')">✂️ <span>Propagation</span></button><button onclick="go('dashboard')">◈ <span>Dashboard</span></button></nav></aside><main class="main" id="main"></main></div><div id="modal" class="modal hidden"></div><script>const API='https://izsjxfigndqkuarooequ.supabase.co/rest/v1',KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'};let plants=[],sales=[],view='collection',filter='all';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'£'+Number(x||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10);async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{...H,...(opt.headers||{})}}),t=await r.text(),d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.message||d?.hint||t);return d}async function load(){try{plants=await api('/plants?select=*&order=created_at.desc');sales=await api('/sales?select=*&order=sale_date.desc');render()}catch(e){main.innerHTML='<section class="panel"><h2>Database error</h2><p class="sub">'+esc(e.message)+'</p><button class="btn primary" onclick="load()">Retry</button></section>'}}function go(v){view=v;render()}function header(t,s,a=''){return `<div class="top"><div><div class="eyebrow">J2GROWS OPERATING SYSTEM</div><div class="title">${t}</div><div class="sub">${s}</div></div><div class="actions">${a}</div></div>`}function pill(p){if(p.ownership_type==='Personal')return '<span class="pill personal">Personal</span>';if(p.status==='Sold')return '<span class="pill sold">Sold</span>';if(p.status==='For Sale'||p.ownership_type==='Sale')return '<span class="pill sale">Sale</span>';return '<span class="pill growing">Growing</span>'}function render(){if(view==='collection')collection();else if(view==='sales')salesPage();else if(view==='prop')propPage();else dashboard()}function collection(){let arr=plants.filter(p=>filter==='all'||p.ownership_type===filter);let personal=plants.filter(p=>p.ownership_type==='Personal'),sale=plants.filter(p=>p.ownership_type==='Sale');main.innerHTML=header('Collection','Decide whether each plant is Personal or Sale — J2Grows handles the workflow accordingly.',`<button class="btn primary" onclick="plantForm()">＋ Add plant</button>`)+`<div class="cards"><div class="card"><div class="label">Total</div><div class="metric">${plants.length}</div></div><div class="card"><div class="label">Personal</div><div class="metric blue">${personal.length}</div><div class="sub">Never pushed into sales</div></div><div class="card"><div class="label">Sale stock</div><div class="metric gold">${sale.length}</div><div class="sub">Eligible for sales workflow</div></div><div class="card"><div class="label">Sold</div><div class="metric">${plants.filter(p=>p.status==='Sold').length}</div></div></div><div class="tabs"><button class="tab ${filter==='all'?'active':''}" onclick="setFilter('all')">All</button><button class="tab ${filter==='Personal'?'active':''}" onclick="setFilter('Personal')">Personal</button><button class="tab ${filter==='Sale'?'active':''}" onclick="setFilter('Sale')">Sale</button></div><section class="panel">${table(arr)}</section>`}function setFilter(x){filter=x;collection()}function table(rows){if(!rows.length)return '<div class="empty">Nothing here yet.<br><br><button class="btn primary" onclick="plantForm()">Add plant</button></div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Ownership</th><th>Source</th><th>Cost</th><th>Sale price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="btn" style="text-align:left" onclick="profile('${p.id}')"><b>${esc(p.name)}</b><div class="sub">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</div></button></td><td>${pill(p)}</td><td>${esc(p.purchase_source||p.source||'—')}</td><td>${money(p.cost)}</td><td>${p.ownership_type==='Sale'?money(p.sale_price):'—'}</td><td>${esc(p.status||'Owned')}</td><td><div class="actions"><button class="btn" onclick="plantForm('${p.id}')">Edit</button>${p.ownership_type==='Sale'&&p.status!=='Sold'?`<button class="btn gold" onclick="moveSale('${p.id}')">£ Sales</button>`:''}${p.ownership_type==='Sale'&&p.status==='For Sale'?`<button class="btn primary" onclick="sell('${p.id}')">Sell</button>`:''}<button class="btn" onclick="prop('${p.id}')">✂</button></div></td></tr>`).join('')}</tbody></table></div>`}function plantForm(id=''){let p=plants.find(x=>x.id===id)||{ownership_type:'Sale',status:'Owned'};$('modal').innerHTML=`<div class="box"><div class="head"><h2>${id?'Edit plant':'Add plant'}</h2><button class="close" onclick="close()">×</button></div><form onsubmit="savePlant(event,'${id}')"><div class="field full"><label>How should J2Grows handle this plant?</label><div class="ownership"><div id="op" class="own personal ${p.ownership_type==='Personal'?'selected':''}" onclick="choose('Personal')"><b>🌿 Personal</b><span class="sub">Keep in your collection. No sales workflow, no sale target required.</span></div><div id="os" class="own sale ${p.ownership_type==='Sale'?'selected':''}" onclick="choose('Sale')"><b>💷 Sale</b><span class="sub">Treat as business stock. Enables sale price, sales actions and profit tracking.</span></div></div><input id="own" type="hidden" value="${esc(p.ownership_type||'Sale')}"></div><div class="form"><div class="field"><label>Plant name *</label><input class="input" id="name" required value="${esc(p.name||'')}"></div><div class="field"><label>Species</label><input class="input" id="species" value="${esc(p.species||'')}"></div><div class="field"><label>Variety / cultivar</label><input class="input" id="variety" value="${esc(p.variety||'')}"></div><div class="field"><label>Where did you get it?</label><input class="input" id="source" value="${esc(p.purchase_source||p.source||'')}"></div><div class="field"><label>Cost (£)</label><input class="input" id="cost" type="number" step="0.01" value="${esc(p.cost||0)}"></div><div class="field saleOnly"><label>Sale price (£)</label><input class="input" id="salePrice" type="number" step="0.01" value="${esc(p.sale_price||0)}"></div><div class="field"><label>Purchase date</label><input class="input" id="date" type="date" value="${esc(p.purchase_date||'')}"></div><div class="field"><label>Location</label><input class="input" id="location" value="${esc(p.location||'')}"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="notes">${esc(p.notes||'')}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>`;$('modal').classList.remove('hidden');updateOwnership()}function choose(v){$('own').value=v;$('op').classList.toggle('selected',v==='Personal');$('os').classList.toggle('selected',v==='Sale');updateOwnership()}function updateOwnership(){let sale=$('own').value==='Sale';document.querySelectorAll('.saleOnly').forEach(x=>x.style.display=sale?'grid':'none')}async function savePlant(e,id){e.preventDefault();let own=$('own').value,p={name:$('name').value,species:$('species').value,variety:$('variety').value,purchase_source:$('source').value,cost:Number($('cost').value||0),purchase_date:$('date').value||null,location:$('location').value,notes:$('notes').value,ownership_type:own,sale_price:own==='Sale'?Number($('salePrice').value||0):0,status:own==='Personal'?'Owned':'Owned'};try{if(id)await api('/plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(p)});else{p.plant_code='J2G-'+Date.now().toString(36).toUpperCase();await api('/plants',{method:'POST',body:JSON.stringify(p)})}close();await load()}catch(err){alert('Could not save plant: '+err.message)}}function close(){$('modal').classList.add('hidden');$('modal').innerHTML=''}async function moveSale(id){let p=plants.find(x=>x.id===id);if(!p||p.ownership_type!=='Sale')return;let price=prompt('Sale price (£)',p.sale_price||'');if(price===null)return;try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:Number(price)})});await load()}catch(e){alert(e.message)}}async function sell(id){let p=plants.find(x=>x.id===id);if(!p)return;let price=prompt('Actual sale price (£)',p.sale_price||'');if(price===null)return;let buyer=prompt('Buyer (optional)','')||'';try{await api('/sales',{method:'POST',body:JSON.stringify({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:Number(price),cost:Number(p.cost||0),buyer,channel:'Direct',notes:'Created from J2Grows Sale stock'})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'Sold'})});await load()}catch(e){alert('Could not complete sale: '+e.message)}}function salesPage(){let rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0);main.innerHTML=header('Sales','Only Sale-owned plants appear in the sales workflow.')+'<div class="cards"><div class="card"><div class="label">Sales</div><div class="metric">'+sales.length+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric gold">'+money(rev)+'</div></div></div><section class="panel">'+(sales.length?'<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Plant</th><th>Price</th><th>Cost</th><th>Profit</th><th>Buyer</th></tr>'+sales.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(s.plant_name)}</td><td>${money(s.sale_price)}</td><td>${money(s.cost)}</td><td class="green">${money(Number(s.sale_price)-Number(s.cost))}</td><td>${esc(s.buyer||'—')}</td></tr>`).join('')+'</table></div>':'<div class="empty">No sales yet.</div>')+'</section>'}function prop(id){let p=plants.find(x=>x.id===id);if(!p)return;let name=prompt('New propagated plant name',p.name+' cutting');if(!name)return;let type=prompt('Propagation type','Node cutting')||'Node cutting';api('/propagations',{method:'POST',body:JSON.stringify({plant_id:p.id,propagated_at:today(),propagation_type:type,notes:'Created from '+p.name})}).then(()=>alert('Propagation recorded.')).catch(e=>alert(e.message))}function propPage(){main.innerHTML=header('Propagation','Personal and Sale plants can both be propagated. New cuttings inherit the parent ownership type by default.')+'<section class="panel"><div class="empty">Use ✂ on any plant to record a propagation.</div></section>'}function dashboard(){let personal=plants.filter(p=>p.ownership_type==='Personal').length,sale=plants.filter(p=>p.ownership_type==='Sale').length,rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0);main.innerHTML=header('Dashboard','A clean separation between your personal collection and J2Grows sale stock.')+'<div class="cards"><div class="card"><div class="label">All plants</div><div class="metric">'+plants.length+'</div></div><div class="card"><div class="label">Personal</div><div class="metric blue">'+personal+'</div></div><div class="card"><div class="label">Sale stock</div><div class="metric gold">'+sale+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric green">'+money(rev)+'</div></div></div><section class="panel"><h2>How J2Grows handles them</h2><div class="facts"><p><b>🌿 Personal</b><br><span class="sub">Collection-only. No sale buttons or sale pricing pressure.</span></p><p><b>💷 Sale</b><br><span class="sub">Business stock. Sale price, move-to-sales and sell workflow are enabled.</span></p></div></section>'}async function profile(id){
      const p=plants.find(x=>x.id===id); if(!p)return;
      $('modal').innerHTML='<div class="box" id="profileBox"><div class="head"><div><div class="eyebrow">J2GROWS PLANT PROFILE</div><div class="profileTitle">'+esc(p.name)+'</div><div class="profileId">'+esc(p.plant_code||p.id)+'</div></div><button class="close" onclick="close()">×</button></div><div class="empty">Loading…</div></div>';
      $('modal').classList.remove('hidden');
      let children=[],props=[],plantSales=[];
      try{children=await api('/plants?select=id,name,status,ownership_type,parent_plant_id&parent_plant_id=eq.'+encodeURIComponent(id)+'&order=created_at.desc')}catch(e){}
      try{props=await api('/propagations?select=*&plant_id=eq.'+encodeURIComponent(id)+'&order=propagated_at.desc')}catch(e){}
      try{plantSales=await api('/sales?select=*&plant_id=eq.'+encodeURIComponent(id)+'&order=sale_date.desc')}catch(e){}
      const parent=p.parent_plant_id?plants.find(x=>x.id===p.parent_plant_id):null;
      let events=[];
      if(p.purchase_date)events.push('<div class="event">🛒 <div><b>Acquired</b><div class="sub">'+esc(p.purchase_date)+' · '+esc(p.purchase_source||p.source||'Source not recorded')+'</div></div></div>');
      props.forEach(x=>events.push('<div class="event">✂️ <div><b>Propagation · '+esc(x.propagation_type||'Propagation')+'</b><div class="sub">'+esc(x.propagated_at||'')+'</div></div></div>'));
      plantSales.forEach(x=>events.push('<div class="event">💷 <div><b>Sold for '+money(x.sale_price)+'</b><div class="sub">'+esc(x.sale_date||'')+'</div></div></div>'));
      const photo=p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="'+esc(p.name)+'">':'<div class="ph">🌿</div>';
      $('profileBox').innerHTML='<div class="head"><div><div class="eyebrow">J2GROWS PLANT PROFILE</div><div class="profileTitle">'+esc(p.name)+'</div><div class="profileId">'+esc(p.plant_code||p.id)+'</div></div><button class="close" onclick="close()">×</button></div>'+
        '<div class="profileHero"><div class="profilePhoto">'+photo+'</div><div class="panel"><div>'+pill(p)+'</div><div class="sub" style="margin-top:9px">'+esc(p.species||'Species not recorded')+(p.variety?' · '+esc(p.variety):'')+'</div><div class="profileActions"><button class="btn primary" onclick="close();plantForm(\''+p.id+'\')">Edit</button><button class="btn" onclick="close();prop(\''+p.id+'\')">✂ Propagate</button></div></div></div>'+
        '<div class="profileGrid"><div class="profileCard"><div class="label">Cost</div><div class="metric">'+money(p.cost)+'</div></div><div class="profileCard"><div class="label">Current value</div><div class="metric">'+money(p.current_value)+'</div></div><div class="profileCard"><div class="label">Sale price</div><div class="metric gold">'+(p.ownership_type==='Sale'?money(p.sale_price):'—')+'</div></div><div class="profileCard"><div class="label">Location</div><div class="metric" style="font-size:18px">'+esc(p.location||'Not set')+'</div></div></div>'+
        '<section class="profileSection"><h3>Details</h3><div class="profileFacts"><div class="fact"><b>Where acquired</b>'+esc(p.purchase_source||p.source||'Not recorded')+'</div><div class="fact"><b>Health</b>'+esc(p.health||'Healthy')+'</div><div class="fact"><b>Purchase date</b>'+esc(p.purchase_date||'Not recorded')+'</div><div class="fact"><b>Ownership</b>'+esc(p.ownership_type||'Sale')+'</div><div class="fact"><b>Parent</b>'+(parent?'<a onclick="profile(\''+parent.id+'\')">'+esc(parent.name)+'</a>':'Original plant')+'</div><div class="fact"><b>Propagations</b>'+String(p.propagation_count||props.length||0)+'</div></div>'+(p.notes?'<div class="fact" style="margin-top:10px"><b>Notes</b>'+esc(p.notes)+'</div>':'')+'</section>'+
        '<section class="profileSection"><h3>Family tree</h3><div class="family"><div class="familyCard"><div class="label">Parent</div><p>'+(parent?'<a onclick="profile(\''+parent.id+'\')">🌿 '+esc(parent.name)+'</a>':'🌱 Original plant')+'</p></div><div class="familyCard"><div class="label">Children / cuttings</div>'+(children.length?children.map(c=>'<p style="margin:7px 0"><a onclick="profile(\''+c.id+'\')">✂️ '+esc(c.name)+'</a><span class="sub"> · '+esc(c.status||'Growing')+'</span></p>').join(''):'<p class="sub">No propagated children recorded.</p>')+'</div></div></section>'+
        '<section class="profileSection"><h3>History</h3><div class="timeline">'+(events.length?events.join(''):'<div class="empty">No history recorded yet.</div>')+'</div></section>';
    }
    load();</script></body></html>
