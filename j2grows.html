function nav(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">J2GROWS OPERATING SYSTEM</div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function dashboard(){let held=state.plants.filter(p=>!['Sold','Lost'].includes(p.status)),forSale=state.plants.filter(p=>p.status==='For Sale'),rev=state.sales.reduce((a,s)=>a+Number(s.sale_price||0),0),fees=state.sales.reduce((a,s)=>a+Number(s.platform_fee||0)+Number(s.postage_cost||0)+Number(s.packaging_cost||0)+Number(s.other_cost||0),0),cost=state.sales.reduce((a,s)=>a+Number(s.cost||0),0),exp=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0),profit=rev-fees-cost-exp,value=held.reduce((a,p)=>a+Number(p.current_value||p.sale_price||p.cost||0),0);return nav('Dashboard','Your collection, propagation pipeline and business performance at a glance.',`<button class="btn primary" onclick="plantForm()">＋ Add plant</button><button class="btn" onclick="saleForm()">＋ Log sale</button>`)+`<div class="cards"><div class="card"><div class="label">Collection</div><div class="metric">${held.length}</div><div class="sub">${forSale.length} currently for sale</div></div><div class="card"><div class="label">Inventory value</div><div class="metric green">${money(value)}</div><div class="sub">estimated current value</div></div><div class="card"><div class="label">Revenue</div><div class="metric">${money(rev)}</div><div class="sub">${state.sales.length} completed sales</div></div><div class="card"><div class="label">Net profit</div><div class="metric ${profit>=0?'green':'red'}">${money(profit)}</div><div class="sub">after costs & expenses</div></div></div><div class="grid2"><section class="panel"><div class="panelhead"><h2>Collection pulse</h2><button class="btn" onclick="setView('plants')">Open collection</button></div>${plantTable(state.plants.slice(0,7))}</section><section class="panel"><div class="panelhead"><h2>Sales performance</h2><button class="btn" onclick="setView('analytics')">Analytics</button></div><div class="facts"><div class="fact"><span class="sub">Gross</span><b>${money(rev)}</b></div><div class="fact"><span class="sub">Sale costs</span><b>${money(fees+cost)}</b></ function plantTable(rows){if(!rows.length)return '<div class="empty">No plants yet.<br><br><button class="btn primary" onclick="plantForm()">Add your first plant</button></div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Value</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</div></td><td>${esc(p.purchase_source||p.source||'—')}</td><td>${money(p.cost)}</td><td>${money(p.current_value||p.sale_price)}</td><td>${tag(p.status)}</td><td><div class="actions"><button class="btn" onclick="profile('${p.id}')">View</button><button class="btn" onclick="plantForm('${p.id}')">Edit</button>${!['For Sale','Sold'].includes(p.status)?`<button class="btn" onclick="moveSale('${p.id}')">£ Sale</button>`:''}${p.status==='For Sale'?`<button class="btn primary" onclick="sell('${p.id}')">Sell</button>`:''}<button class="btn" onclick="propForm('${p.id}')">✂</button></div></td></tr>`).join('')}</tbody></table></div>`}
function tag(s){let c=s==='Sold'?'red':s==='For Sale'?'gold':s==='Propagating'?'blue':'';return `<span class="tag ${c}">${esc(s||'Owned')}</span>`}
function plants(){return nav('Collection','Every plant, its value, origin and current lifecycle.',`<input id="plantSearch" class="input search" placeholder="Search collection…" oninput="renderPlants()"><button class="btn primary" onclick="plantForm()">＋ Add plant</button>`)+`<section class="panel" id="plantPanel">${plantTable(state.plants)}</section>`}
function renderPlants(){let q=($('plantSearch')?.value||'').toLowerCase();$('plantPanel').innerHTML=plantTable(state.plants.filter(p=>JSON.stringify(p).toLowerCase().includes(q)))}
function profile(id){let p=state.plants.find(x=>x.id===id);if(!p)return;let parent=state.plants.find(x=>x.id===p.parent_plant_id),kids=state.plants.filter(x=>x.parent_plant_id===p.id);let history=state.props.filter(x=>x.plant_id===p.id||x.child_plant_id===p.id);$('root').innerHTML=nav(p.name,'Plant profile · '+esc(p.plant_code),`<button class="btn" onclick="setView('plants')">← Collection</button><button class="btn primary" onclick="plantForm('${p.id}')">Edit</button>`)+`<section class="panel profile"><div><div class="photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'🌿'}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="propForm('${p.id}')">✂ Propagate</button>${p.status!=='Sold'?`<button class="btn" onclick="moveSale('${p.id}')">£ Move to Sale</button>`:''}</div></div><div><div class="eyebrow">${esc(p.status)}</div><h1 style="margin:5px 0">${esc(p.name)}</h1><p class="sub">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</p><div class="facts"><div class="fact"><span class="sub">Acquired from</span><b>${esc(p.purchase_source||p.source||'—')}</b></div><div class="fact"><span class="sub">Cost</span><b>${money(p.cost)}</b></div><div class="fact"><span class="sub">Current value</span><b class="green">${money(p.current_value||p.sale_price)}</b></div><div class="fact"><span class="sub">Location</span><b>${esc(p.location||'—')}</b></div><div class="fact"><span class="sub">Health</span><b>${esc(p.health||'Healthy')}</b></div><div class="fact"><span class="sub">Purchased</span><b>${fmt(p.purchase_date)}</b></div></div><div style="margin-top:16px"><b>Notes</b><p class="sub">${esc(p.notes||'No notes')}</p></div></div></section><section class="panel"><div class="panelhead"><h2>Family tree</h2></div><div class="tree">${parent?`<div class="node">Parent: <b>${esc(parent.name)}</b></div><span>→</span>`:''}<div class="node"><b>${esc(p.name)}</b></div>${kids.length?`<span>→</span>${kids.map(k=>`<div class="node">${esc(k.name)}</div>`).join( function analytics(){let rev=state.sales.reduce((a,s)=>a+Number(s.sale_price||0),0),saleCosts=state.sales.reduce((a,s)=>a+Number(s.cost||0)+Number(s.platform_fee||0)+Number(s.postage_cost||0)+Number(s.packaging_cost||0)+Number(s.other_cost||0),0),exp=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0),profit=rev-saleCosts-exp;let months=[...Array(6)].map((_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);let key=d.toISOString().slice(0,7),r=state.sales.filter(s=>String(s.sale_date).startsWith(key)).reduce((a,s)=>a+Number(s.sale_price||0),0);return {key,r}});let max=Math.max(1,...months.map(x=>x.r));return nav('Analytics','Understand what is growing your collection and your business.')+`<div class="cards"><div class="card"><div class="label">Revenue</div><div class="metric green">${money(rev)}</div></div><div class="card"><div class="label">COGS + fees</div><div class="metric">${money(saleCosts)}</div></div><div class="card"><div class="label">Expenses</div><div class="metric">${money(exp)}</div></div><div class="card"><div class="label">Net profit</div><div class="metric ${profit>=0?'green':'red'}">${money(profit)}</div></div></div><section class="panel"><div class="panelhead"><h2>Revenue · last 6 months</h2></div><div class="chart">${months.map(m=>`<div class="col" style="height:${Math.max(8,m.r/max*130)}px"><span>${m.key.slice(5)}</span></div>`).join('')}</div></section><div class="grid2"><section class="panel"><h2>Inventory value</h2><div class="metric green">${money(state.plants.filter(p=>!['Sold','Lost'].includes(p.status)).reduce((a,p)=>a+Number(p.current_value||p.sale_price||p.cost||0),0))}</div><p class="sub">Estimated current value of held plants.</p></section><section class="panel"><h2>Average sale</h2><div class="metric">${money(state.sales.length?rev/state.sales.length:0)}</div><p class="sub">Across ${state.sales.length} completed transactions.</p></section></div>`}

function setView(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));function render(){let m={dashboard:dashboard,plants:plants,prop:prop,sales:sales,expenses:expenses,analytics:analytics,reminders:reminders};$('root').innerHTML=m[view]()} 
function openModal(html){$('modal').innerHTML=`<div class="modalbox">${html}</div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function plantForm(id=''){let p=state.plants.find(x=>x.id===id)||{};openModal(`<div class="modalhead"><h2>${id?'Edit plant':'Add plant'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlant(event,'${id}')"><div class="form"><div class="field"><label>Plant name *</label><input class="input" id="pn" required value="${esc(p.name||'')}"></div><div class="field"><label>Species</label><input class="input" id="ps" value="${esc(p.species||'')}"></div><div class="field"><label>Variety / cultivar</label><input class="input" id="pv" value="${esc(p.variety||'')}"></div><div class="field"><label>Status</label><select class="select" id="pst">${['Owned','Growing','For Sale','Reserved','Propagating','Sold','Lost'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Where did you get it?</label><input class="input" id="psrc" value="${esc(p.purchase_source||p.source||'')}"></div><div class="field"><label>Purchase cost (£)</label><input class="input" id="pcost" type="number" step="0.01" value="${Number(p.cost||0)}"></div><div class="field"><label>Purchase date</label><input class="input" id="pdate" type="date" value="${esc(p.purchase_date||'')}"></div><div class="field"><label>Location</label><input class="input" id="ploc" value="${esc(p.location||'')}"></div><div class="field"><label>Current value (£)</label><input class="input" id="pvalue" type="number" step="0.01" value="${Number(p.current_value||0)}"></div><div class="field"><label>Target sale price (£)</label><input class="input" id="psale" type="number" step="0.01" value="${Number(p.sale_price||0)}"></div><div class="field"><label>Minimum sale price (£)</label><input class="input" id="pmin" type="number" step="0.01" value="${Number(p.minimum_price||0)}"></div><div class="field"><label>Health</label><select class="select" id="phealth">${['Healthy','Watch','Needs attention','Quarantined'].map(x=>`<option ${p.health===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Photo URL</label><input class="input" id="pphoto" value="${esc(p.photo_url||'')}" placeholder="https://…"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="pnotes">${esc(p.notes||'')}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save plant</button></div></form>`)}
async function savePlant(e,id){e.preventDefault();try{let d={name:$('pn').value.trim(),species:$('ps').value.trim(),variety:$('pv').value.trim(),status:$('pst').value,purchase_source:$('psrc').value.trim(),cost:Number($('pcost').value||0),purchase_date:$('pdate').value||null,location:$('ploc').value.trim(),current_value:Number($('pvalue').value||0),sale_price:Number($('psale').value||0),minimum_price:Number($('pmin').value||0),health:$('phealth').value,photo_url:$('pphoto').value.trim(),notes:$('pnotes').value.trim()};await api(id?`/plants?id=eq.${id}`:'/plants',{method:id?'PATCH':'POST',body:JSON.stringify(id?d:{plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...d})});closeModal();await load()}catch(e){alert('Could not save plant: '+e.message)}}
async function moveSale(id){let p=state.plants.find(x=>x.id===id),price=prompt('Asking price (£)',p?.sale_price||'');if(price===null)return;try{await api(`/plants?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:Number(price),listed_at:new Date().toISOString()})});load()}catch(e){alert(e.message)}}
function saleForm(){let p=state.plants.find(x=>x.status==='For Sale');openModal(`<div class="modalhead"><h2>Log completed sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="form"><div class="field full"><label>Plant</label><select class="select" id="saleplant">${state.plants.filter(x=>x.status==='For Sale'||x.status==='Reserved').map(x=>`<option value="${x.id}">${esc(x.name)} · ${money(x.sale_price)}</option>`).join('')}</select></div><div class="field"><label>Sale price (£)</label><input class="input" id="saleprice" type="number" step="0.01" required value="${Number(p?.sale_price||0)}"></div><div class="field"><label>Date</label><input class="input" id="saledate" type="date" value="${today()}"></div><div class="field"><label>Buyer</label><input class="input" id="buyer"></div><div class="field"><label>Platform / channel</label><input class="input" id="channel" placeholder="Direct, eBay, Etsy…"></div><div class="field"><label>Platform fee (£)</label><input class="input" id="fee" type="number" step="0.01" value="0"></div><div class="field"><label>Postage (£)</label><input class="input" id="postage" type="number" step="0.01" value="0"></div><div class="field"><label>Packaging (£)</label><input class="input" id="pack" type="number" step="0.01" value="0"></div><div class="field"><label>Other cost (£)</label><input class="input" id="other" type="number" step="0.01" value="0"></div><div class="field"><label>Listing URL</label><input class="input" id="listing"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="snotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Record sale</button></div></form></div>`)}
async function saveSale(e){e.preventDefault();try{let p=state.plants.find(x=>x.id==$('saleplant').value);let d={plant_id:p.id,plant_name:p.name,sale_date:$('saledate').value,sale_price:Number($('saleprice').value||0),cost:Number(p.cost||0),buyer:$('buyer').value,channel:$('channel').value,platform_fee:Number($('fee').value||0),postage_cost:Number($('postage').value||0),packaging_cost:Number($('pack').value||0),other_cost:Number($('other').value||0),listing_url:$('listing').value,notes:$('snotes').value};await api('/sales',{method:'POST',body:JSON.stringify(d)});await api(`/plants?id=eq.${p.id}`,{method:'PATCH',body:JSON.stringify({status:'Sold',sale_price:d.sale_price,sale_date:d.sale_date})});closeModal();load()}catch(e){alert('Could not record sale: '+e.message)}}
async function sell(id){let p=state.plants.find(x=>x.id===id);saleForm();setTimeout(()=>{if($('saleplant'))$('saleplant').value=p.id},0)}
function propForm(parentId=''){let p=state.plants.find(x=>x.id===parentId);openModal(`<div class="modalhead"><h2>✂ New propagation</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProp(event)"><div class="form"><div class="field full"><label>Parent plant</label><select class="select" id="parent">${state.plants.filter(x=>x.status!=='Sold').map(x=>`<option value="${x.id}" ${x.id===parentId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Propagation type</label><select class="select" id="ptype">${['Node cutting','Top cutting','Stem cutting','Division','Offset','Leaf','Seed'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Date</label><input class="input" id="pdate2" type="date" value="${today()}"></div><div class="field"><label>New plant name</label><input class="input" id="childname" value="${esc(p?.name||'Plant')} cutting"></div><div class="field"><label>Location</label><input class="input" id="childloc" value="${esc(p?.location||'')}"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="propnotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create cutting</button></div></form></div>`)}
async function saveProp(e){e.preventDefault();try{let p=state.plants.find(x=>x.id==$('parent').value),child=await api('/plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),parent_plant_id:p.id,name:$('childname').value,species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.plant_code,purchase_date:$('pdate2').value,location:$('childloc').value,current_value:0,sale_price:0,notes:$('propnotes').value})});await api('/propagations',{method:'POST',body:JSON.stringify({plant_id:p.id,child_plant_id:child[0].id,propagation_type:$('ptype').value,propagated_at:$('pdate2').value,notes:$('propnotes').value})});closeModal();load()}catch(e){alert('Could not propagate: '+e.message)}}
function expenseForm(){openModal(`<div class="modalhead"><h2>Add expense</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Category</label><select class="select" id="ecat">${['Plants','Soil & fertiliser','Pots','Packaging','Postage','Marketplace fees','3D printing','Electricity','Equipment','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (£)</label><input class="input" id="eamount" type="number" step="0.01" required></div><div class="field"><label>Date</label><input class="input" id="edate" type="date" value="${today()}"></div><div class="field"><label>Description</label><input class="input" id="edesc" required></div><div class="field full"><label>Notes</label><textarea class="textarea" id="enotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form></div>`)}
async function saveExpense(e){e.preventDefault();try{await api('/expenses',{method:'POST',body:JSON.stringify({category:$('ecat').value,description:$('edesc').value,amount:Number($('eamount').value||0),expense_date:$('edate').value,notes:$('enotes').value})});closeModal();load()}catch(e){alert(e.message)}}
function reminderForm(){openModal(`<div class="modalhead"><h2>Add care reminder</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveReminder(event)"><div class="form"><div class="field"><label>Plant</label><select class="select" id="rplant"><option value="">General</option>${state.plants.filter(x=>x.status!=='Sold').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Reminder</label><select class="select" id="rtype"><option>Water</option><option>Repot</option><option>Check roots</option><option>Check pests</option><option>Propagation check</option><option>Photo / valuation</option><option>Other</option></select></div><div class="field"><label>Due date</label><input class="input" id="rdate" type="date" value="${today()}"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="rnotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save reminder</button></div></form></div>`)}
async function saveReminder(e){e.preventDefault();try{await api('/care_reminders',{method:'POST',body:JSON.stringify({plant_id:$('rplant').value||null,reminder_type:$('rtype').value,due_date:$('rdate').value,notes:$('rnotes').value})});closeModal();load()}catch(e){alert(e.message)}}async function completeReminder(id){await api(`/care_reminders?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({completed:true})});load()}
load();</script></body></html>
