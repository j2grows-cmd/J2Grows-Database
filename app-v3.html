<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows Database</title><style>body{margin:0;background:#07110c;color:#f5f8f5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#102018;border:1px solid #284633;border-radius:14px;padding:16px;margin:12px 0}.btn,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #284633;background:#08150d;color:#f5f8f5}.btn{cursor:pointer}.primary{background:#7ee787;color:#06200b}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.box{width:min(650px,90vw);background:#0b1911;padding:22px;border-radius:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field{display:grid;gap:5px}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #284633;text-align:left}.muted{color:#91a799}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><div class="top"><div><h1>🌱 J2Grows</h1><div class="muted">Plant inventory, propagation & sales</div></div><button class="btn primary" onclick="openPlant()">+ Add plant</button></div><div class="grid"><div class="card"><b>Plants</b><h2 id="count">0</h2></div><div class="card"><b>For sale</b><h2 id="forsale">0</h2></div><div class="card"><b>Revenue</b><h2 id="revenue">£0.00</h2></div><div class="card"><b>Profit</b><h2 id="profit">£0.00</h2></div></div><section class="panel"><div class="top"><h2>My Plants</h2><input id="search" placeholder="Search plants" oninput="render()"></div><div id="list">Loading…</div></section></main><div id="modal" class="modal hidden"></div><script>const API='https://izsjxfigndqkuarooequ.supabase.co/rest/v1';const KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';let plants=[],sales=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Number(n||0).toFixed(2);const today=()=>new Date().toISOString().slice(0,10);async function request(path,options={}){const r=await fetch(API+'/'+path,{...options,headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation',...(options.headers||{})}});const text=await r.text();let body;try{body=text?JSON.parse(text):null}catch{body=text}if(!r.ok)throw Error(body?.message||body?.hint||body?.error||text||('HTTP '+r.status));return body}async function load(){try{[plants,sales]=await Promise.all([request('plants?select=*&order=created_at.desc'),request('sales?select=*&order=sale_date.desc')]);render()}catch(e){$('list').innerHTML='<p>Database error: '+esc(e.message)+'</p>'}}function render(){const q=($('search')?.value||'').toLowerCase();const rows=plants.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('count').textContent=plants.length;$('forsale').textContent=plants.filter(p=>p.status==='For Sale').length;const rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0);$('revenue').textContent=money(rev);$('profit').textContent=money(rev-cost);if(!rows.length){$('list').innerHTML='<p class="muted">No plants yet. Click + Add plant to get started.</p>';return}$('list').innerHTML='<table><thead><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Sale</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.species||'')+(p.variety?' · '+esc(p.variety):'')+'</span></td><td>'+esc(p.purchase_source||p.source||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.sale_price)+'</td><td>'+esc(p.status)+'</td><td><div class="actions"><button class="btn" onclick="openPlant(\''+p.id+'\')">Edit</button>'+((p.status!=='For Sale'&&p.status!=='Sold')?'<button class="btn" onclick="moveSale(\''+p.id+'\')">£ Sales</button>':'')+(p.status==='For Sale'?'<button class="btn primary" onclick="sell(\''+p.id+'\')">Sell</button>':'')+'<button class="btn" onclick="cut(\''+p.id+'\')">✂ Cut</button></div></td></tr>').join('')}</tbody></table>'}function close(){$('modal').classList.add('hidden');$('modal').innerHTML=''}function openPlant(id=''){const p=plants.find(x=>x.id===id)||{};$('modal').innerHTML='<div class="box"><h2>'+(id?'Edit':'Add')+' plant</h2><form onsubmit="savePlant(event,\''+id+'\')"><div class="form"><div class="field"><label>Name *</label><input id="name" required value="'+esc(p.name||'')+'"></div><div class="field"><label>Species</label><input id="species" value="'+esc(p.species||'')+'"></div><div class="field"><label>Variety</label><input id="variety" value="'+esc(p.variety||'')+'"></div><div class="field"><label>Status</label><select id="status">'+['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>'<option '+(p.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Where did you get it?</label><input id="source" value="'+esc(p.purchase_source||p.source||'')+'"></div><div class="field"><label>Cost (£)</label><input id="cost" type="number" step="0.01" value="'+Number(p.cost||0)+'"></div><div class="field"><label>Purchase date</label><input id="date" type="date" value="'+esc(p.purchase_date||'')+'"></div><div class="field"><label>Location</label><input id="location" value="'+esc(p.location||'')+'"></div><div class="field"><label>Sale price (£)</label><input id="saleprice" type="number" step="0.01" value="'+Number(p.sale_price||0)+'"></div><div class="field full"><label>Notes</label><textarea id="notes">'+esc(p.notes||'')+'</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:15px"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>';$('modal').classList.remove('hidden')}async function savePlant(e,id){e.preventDefault();try{const data={name:$('name').value.trim(),species:$('species').value.trim(),variety:$('variety').value.trim(),status:$('status').value,purchase_source:$('source').value.trim(),cost:Number($('cost').value||0),purchase_date:$('date').value||null,location:$('location').value.trim(),sale_price:Number($('saleprice').value||0),notes:$('notes').value.trim()};if(id)await request('plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});else await request('plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data})});close();await load()}catch(e){alert('Could not save plant: '+e.message)}}async function moveSale(id){try{const p=plants.find(x=>x.id===id);const v=prompt('Sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');await request('plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:price,moved_to_sales_at:new Date().toISOString()})});await load()}catch(e){alert('Could not move plant to sales: '+e.message)}}async function sell(id){try{const p=plants.find(x=>x.id===id);const v=prompt('Actual sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');await request('sales',{method:'POST',body:JSON.stringify({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:price,cost:Number(p.cost||0)})});await request('plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:'Sold',sale_price:price,sale_date:today()})});await load()}catch(e){alert('Could not record sale: '+e.message)}}async function cut(id){try{const p=plants.find(x=>x.id===id);if(!p)return;const name=prompt('Name for new cutting',p.name+' cutting');if(name===null)return;await request('plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),parent_plant_id:p.id,name:name,species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.plant_code,purchase_date:today(),location:p.location,sale_price:0,notes:'Propagated from '+p.name})});await request('plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({propagation_count:Number(p.propagation_count||0)+1,status:'Propagating'})});await load()}catch(e){alert('Could not create cutting: '+e.message)}}load();</script></body></html>
