<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J2Grows Database</title>
<style>
:root{--bg:#07110c;--panel:#0d1b14;--panel2:#11251a;--line:#20382a;--text:#f2f7f2;--muted:#8fa596;--accent:#7ee787;--accent2:#3fb950;--danger:#ff7b72;--shadow:0 18px 50px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#173b25 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid var(--line);background:rgba(6,15,10,.86);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;padding:6px 10px 28px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#b6ffbd,#39b85b);display:grid;place-items:center;color:#08220e;font-size:20px;box-shadow:0 8px 24px #39b85b33}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{flex:1;padding:30px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.title{font-size:31px;font-weight:850;margin:3px 0}.sub{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700}.btn:hover{border-color:#365d43}.btn.primary{background:var(--accent);color:#08220e;border-color:var(--accent)}.btn.danger{color:#ffaaa4}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:linear-gradient(180deg,rgba(17,37,26,.92),rgba(10,25,17,.92));border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.card{padding:18px}.metric{font-size:28px;font-weight:850;margin:6px 0}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.panel{padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#193522;color:#a9eeb3;font-size:12px}.grid2{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.search{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;min-width:220px}.empty{padding:45px 15px;text-align:center;color:var(--muted)}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;background:#08150d;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:9px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#0b1911;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 90px #0008}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.footer{margin-top:20px;color:#66806f;font-size:12px}.profit{color:var(--accent);font-weight:800}.loss{color:var(--danger);font-weight:800}@media(max-width:900px){.side{width:72px;padding:16px 8px}.brand span,.nav button span{display:none}.brand{justify-content:center}.nav button{text-align:center}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.cards,.formgrid{grid-template-columns:1fr}.side{display:none}.main{padding:15px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="logo">🌱</div><span>J2Grows</span></div><nav class="nav"><button class="active" data-view="dashboard">◈ <span>Dashboard</span></button><button data-view="plants">🌿 <span>Plants</span></button><button data-view="sales">£ <span>Sales</span></button><button data-view="settings">⚙ <span>Data</span></button></nav></aside><main class="main"><div id="app"></div><div class="footer">J2Grows Database · Data is stored in this browser. Use Export regularly for backup.</div></main></div><div id="modal" class="modal hidden"></div>
<script>
const KEY='j2grows-db-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"plants":[],"sales":[]}');
let view='dashboard';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};
const money=n=>`£${Number(n||0).toFixed(2)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function shell(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">J2Grows Database</div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function dashboard(){const revenue=db.sales.reduce((a,s)=>a+Number(s.salePrice||0),0),cost=db.sales.reduce((a,s)=>a+Number(s.cost||0),0),sold=db.sales.length,available=db.plants.filter(p=>p.status!=='Sold').length;return shell('Dashboard','Your plant collection and trading activity at a glance.',`<button class="btn primary" onclick="openPlant()">+ Add plant</button><button class="btn" onclick="openSale()">+ Log sale</button>`)+`<div class="cards"><div class="card"><div class="label">Plants</div><div class="metric">${db.plants.length}</div><div class="sub">${available} currently held</div></div><div class="card"><div class="label">Sales</div><div class="metric">${sold}</div><div class="sub">completed records</div></div><div class="card"><div class="label">Revenue</div><div class="metric">${money(revenue)}</div><div class="sub">gross recorded sales</div></div><div class="card"><div class="label">Profit</div><div class="metric ${revenue-cost>=0?'profit':'loss'}">${money(revenue-cost)}</div><div class="sub">revenue minus recorded cost</div></div></div><div class="grid2"><section class="panel"><div class="panelhead"><h2>Recent plants</h2><button class="btn" onclick="setView('plants')">View all</button></div>${plantTable(db.plants.slice(-6).reverse())}</section><section class="panel"><div class="panelhead"><h2>Recent sales</h2><button class="btn" onclick="setView('sales')">View all</button></div>${saleTable(db.sales.slice(-6).reverse())}</section></div>`}
function plantTable(items){if(!items.length)return '<div class="empty">No plants logged yet.<br><br><button class="btn primary" onclick="openPlant()">Add your first plant</button></div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Species</th><th>Status</th><th>Cost</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="sub">${esc(p.id)}</small></td><td>${esc(p.species)}</td><td><span class="tag">${esc(p.status)}</span></td><td>${money(p.cost)}</td><td><button class="btn" onclick="openPlant('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function saleTable(items){if(!items.length)return '<div class="empty">No sales logged yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Buyer</th><th>Sale</th><th>Profit</th></tr></thead><tbody>${items.map(s=>{let profit=Number(s.salePrice||0)-Number(s.cost||0);return `<tr><td>${esc(s.date)}</td><td>${esc(s.plant)}</td><td>${esc(s.buyer||'—')}</td><td>${money(s.salePrice)}</td><td class="${profit>=0?'profit':'loss'}">${money(profit)}</td></tr>`}).join('')}</tbody></table></div>`}
function plants(){return shell('Plants','Log every plant you own, propagate, grow or sell.',`<input class="search" id="plantSearch" placeholder="Search plants…" oninput="renderPlants()"><button class="btn primary" onclick="openPlant()">+ Add plant</button>`)+`<section class="panel" id="plantsPanel">${plantTable(db.plants)}</section>`}
function sales(){let rev=db.sales.reduce((a,s)=>a+Number(s.salePrice||0),0);return shell('Sales','Keep a simple trading ledger with cost, revenue and profit.',`<input class="search" id="saleSearch" placeholder="Search sales…" oninput="renderSales()"><button class="btn primary" onclick="openSale()">+ Log sale</button>`)+`<section class="panel"><div class="panelhead"><h2>${db.sales.length} sales · ${money(rev)} revenue</h2></div><div id="salesPanel">${saleTable(db.sales.slice().reverse())}</div></section>`}
function settings(){return shell('Data','Back up, restore and manage your J2Grows records.')+`<section class="panel"><div class="panelhead"><h2>Database backup</h2></div><p class="sub">Your records are stored locally in this browser. Export a JSON backup before changing device or browser.</p><div class="actions"><button class="btn primary" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="exportCSV('plants')">Export plants CSV</button><button class="btn" onclick="exportCSV('sales')">Export sales CSV</button><label class="btn">Import JSON<input type="file" accept="application/json" hidden onchange="importJSON(event)"></label><button class="btn danger" onclick="resetDB()">Clear database</button></div></section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('app').innerHTML=view==='dashboard'?dashboard():view==='plants'?plants():view==='sales'?sales():settings()}
function setView(v){view=v;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function renderPlants(){let q=(document.getElementById('plantSearch')?.value||'').toLowerCase();document.getElementById('plantsPanel').innerHTML=plantTable(db.plants.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}
function renderSales(){let q=(document.getElementById('saleSearch')?.value||'').toLowerCase();document.getElementById('salesPanel').innerHTML=saleTable(db.sales.slice().reverse().filter(s=>Object.values(s).join(' ').toLowerCase().includes(q)))}
function openPlant(id=''){let p=db.plants.find(x=>x.id===id)||{id:'',name:'',species:'',variety:'',status:'Owned',cost:'',purchaseDate:'',source:'',location:'',notes:''};document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edit plant':'Add plant'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlant(event,'${esc(id)}')"><div class="formgrid"><div class="field"><label>Plant name *</label><input id="pn" required value="${esc(p.name)}" placeholder="e.g. Thai Constellation"></div><div class="field"><label>Species</label><input id="ps" value="${esc(p.species)}" placeholder="Monstera deliciosa"></div><div class="field"><label>Variety / cultivar</label><input id="pv" value="${esc(p.variety)}"></div><div class="field"><label>Status</label><select id="pst">${['Owned','Growing','For Sale','Sold','Propagating','Lost'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Purchase cost (£)</label><input id="pc" type="number" step="0.01" value="${esc(p.cost)}"></div><div class="field"><label>Purchase date</label><input id="pd" type="date" value="${esc(p.purchaseDate)}"></div><div class="field"><label>Source / seller</label><input id="pso" value="${esc(p.source)}"></div><div class="field"><label>Location</label><input id="pl" value="${esc(p.location)}" placeholder="Greenhouse, shelf…"></div><div class="field full"><label>Notes</label><textarea id="pno">${esc(p.notes)}</textarea></div></div><div class="actions" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>`;document.getElementById('modal').classList.remove('hidden')}
function savePlant(e,id){e.preventDefault();let p={id:id||'PL-'+Date.now().toString(36).toUpperCase(),name:pn.value,species:ps.value,variety:pv.value,status:pst.value,cost:pc.value,purchaseDate:pd.value,source:pso.value,location:pl.value,notes:pno.value};let i=db.plants.findIndex(x=>x.id===id);if(i>=0)db.plants[i]=p;else db.plants.push(p);save();closeModal()}
function openSale(){let opts=db.plants.map(p=>`<option value="${esc(p.name)}">`).join('');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Log sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="formgrid"><div class="field"><label>Plant *</label><input id="sn" list="plantOptions" required placeholder="Plant sold"><datalist id="plantOptions">${opts}</datalist></div><div class="field"><label>Sale date *</label><input id="sd" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Sale price (£) *</label><input id="sp" type="number" step="0.01" required></div><div class="field"><label>Plant cost (£)</label><input id="sc" type="number" step="0.01" value="0"></div><div class="field"><label>Buyer</label><input id="sb"></div><div class="field"><label>Platform / channel</label><input id="sch" placeholder="eBay, Etsy, local, direct…"></div><div class="field full"><label>Notes</label><textarea id="sno"></textarea></div></div><div class="actions" style="margin-top:18px;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save sale</button></div></form></div>`;document.getElementById('modal').classList.remove('hidden')}
function saveSale(e){e.preventDefault();db.sales.push({id:'SALE-'+Date.now().toString(36).toUpperCase(),plant:sn.value,date:sd.value,salePrice:sp.value,cost:sc.value,buyer:sb.value,channel:sch.value,notes:sno.value});let p=db.plants.find(x=>x.name===sn.value);if(p)p.status='Sold';save();closeModal()}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('j2grows-backup.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(type){let rows=db[type];if(!rows.length)return alert('No records to export.');let keys=[...new Set(rows.flatMap(Object.keys))];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');download(`j2grows-${type}.csv`,csv,'text/csv')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.plants)||!Array.isArray(x.sales))throw Error();db=x;save();alert('Database imported successfully.')}catch{alert('That file is not a valid J2Grows backup.')}};r.readAsText(f)}
function resetDB(){if(confirm('Delete every plant and sale from this browser? This cannot be undone unless you have a backup.')){db={plants:[],sales:[]};save()}}
render();
</script></body></html>
