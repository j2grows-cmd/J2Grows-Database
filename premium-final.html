<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100a"><title>J2Grows Command Centre</title><style>:root{--bg:#06100a;--p:#0b1a11;--p2:#10251a;--line:#234a30;--text:#f4faf5;--muted:#8fa797;--g:#6df08e;--b:#71bdff;--gold:#f0cf72;--red:#ff746b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1b5a3066,transparent 65%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:220px;padding:24px 14px;border-right:1px solid #183722;background:#06100af5;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px;padding:0 8px 30px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#caffd2,#4ad978);color:#05210b}.brand small{display:block;font-size:8px;letter-spacing:.2em;color:#71917d}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:12px;text-align:left;font-weight:850}.nav button.active,.nav button:hover{background:#12301c;border-color:var(--line);color:#fff}.main{margin-left:220px;padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}.ey{color:var(--g);font-size:10px;font-weight:950;letter-spacing:.18em}.title{font-size:35px;font-weight:950;letter-spacing:-.045em;margin:4px 0}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#0b1810;color:#fff;padding:10px 13px;border-radius:11px;font-weight:850;cursor:pointer}.btn:hover{background:#14301c;border-color:#4b7a57}.primary{background:linear-gradient(135deg,#aaffb9,#55db79);color:#05210b;border:0}.gold{color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:linear-gradient(180deg,#10251ae function table(rows){if(!rows.length)return '<div class="empty">No plants match your filters.<br><br><button class="btn primary" id="emptyAdd">＋ Add Plant</button></div>';return '<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Type</th><th>Source</th><th>Cost</th><th>Value / Sale</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="plant" data-open="'+p.id+'">'+esc(p.name)+'<div class="meta">'+esc(p.plant_code||p.id)+' · '+esc(p.species||'')+(p.variety?' · '+esc(p.variety):'')+'</div></button></td><td>'+pill(p)+'</td><td>'+esc(p.purchase_source||p.source||'—')+'</td><td>'+money(p.cost)+'</td><td>'+ (p.ownership_type==='Sale'?money(p.sale_price):money(p.current_value))+'</td><td>'+esc(p.status||'Owned')+'</td><td><button class="btn" data-edit="'+p.id+'">Edit</button> <button class="btn" data-prop="'+p.id+'">✂</button>'+(p.ownership_type==='Sale'&&p.status!=='Sold'?'<button class="btn gold" data-move="'+p.id+'">£ Sales</button>':'')+(p.ownership_type==='Sale'&&p.status==='For Sale'?'<button class="btn primary" data-sell="'+p.id+'">Sell</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'}function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>profile(b.dataset.open));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(b.dataset.edit));document.querySelectorAll('[data-prop]').forEach(b=>b.onclick=()=>propagate(b.dataset.prop));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sell(b.dataset.sell));let e=$('emptyAdd');if(e)e.onclick=()=>form()}function openModal(html){const m=$('modal');m.innerHTML=html;m.hidden=false;document.body.style.overflow='hidden'}function closeModal(){const m=$('modal');m.hidden=true;m.innerHTML='';document.body.style.overflow=''}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEvent async function profile(id){let p=plants.find(x=>x.id===id);if(!p)return;openModal('<div class="box"><div class="mh"><div><div class="ey">J2GROWS PLANT PROFILE</div><div class="name">'+esc(p.name)+' 🌿</div><div class="id">'+esc(p.plant_code||p.id)+'</div></div><button class="close" id="pc">×</button></div><div class="profile"><div class="hero"><div class="photo">🌿</div><div class="info"><div class="badges">'+(p.ownership_type==='Personal'?'<span class="badge personal">Personal Plant</span>':'<span class="badge sale">Sale Plant</span>')+'<span class="badge">● '+esc(p.health||'Healthy')+'</span></div><div class="facts"><div class="fact"><b>Species</b>'+esc(p.species||'—')+'</div><div class="fact"><b>Location</b>'+esc(p.location||'—')+'</div><div class="fact"><b>Cultivar</b>'+esc(p.variety||'—')+'</div><div class="fact"><b>Current Value</b>'+money(p.current_value||p.sale_price)+'</div><div class="fact"><b>Cost</b>'+money(p.cost)+'</div><div class="fact"><b>Acquired</b>'+esc(p.purchase_date||'—')+'</div><div class="fact"><b>Source</b>'+esc(p.purchase_source||p.source||'—')+'</div><div class="fact"><b>Status</b>'+esc(p.status||'Owned')+'</div></div><div class="pa"><button class="btn primary" id="pe">✎ Edit Plant</button><button class="btn" id="pp">✂ Propagate</button>'+(p.ownership_type==='Sale'&&p.status!=='Sold'?'<button class="btn gold" id="pm">🏷 Move to Sale</button>':'')+'</div></div></div><div class="grid3"><div class="pc"><h3>About This Plant</h3><p class="sub">'+esc(p.notes||'No notes recorded yet.')+'</p></div><div class="pc"><h3>Plant Details</h3><p class="sub">Ownership: <b>'+esc(p.ownership_type||'—')+'</b><br>Status: <b>'+esc(p.status||'Owned')+'</b><br>Sale price: <b>'+(p.ownership_type==='Sale'?money(p.sale_price):'—')+'</b></p></div><div class="pc"><h3>Timeline</h3><p class="sub">🛒 Acquired · '+esc(p.purchase_date||'Date not set')+'<br>🌱 Current · '+esc(p.status||'Owned')+'</p></div></div></div></div>');$('pc').onclick=closeModal;$('pe').onclick=()=>{close async function propagate(id){let p=plants.find(x=>x.id===id);if(!p)return;openModal('<div class="box"><div class="mh"><div><div class="ey">PROPAGATION</div><h2>Propagate '+esc(p.name)+'</h2></div><button class="close" id="cx">×</button></div><form class="form" id="cf"><div class="field"><label>New plant name</label><input class="input" id="cn" required value="'+esc(p.name+' cutting')+'"></div><div class="field"><label>Type</label><select class="select" id="ct"><option>Node cutting</option><option>Top cutting</option><option>Stem cutting</option><option>Division</option><option>Offset</option><option>Leaf</option><option>Seed</option></select></div><div class="field full"><label>Notes</label><textarea class="textarea" id="cno"></textarea></div><div class="fa"><button type="button" class="btn" id="cc">Cancel</button><button class="btn primary">Create Propagation</button></div></form></div>');$('cx').onclick=closeModal;$('cc').onclick=closeModal;$('cf').onsubmit=async e=>{e.preventDefault();let d={plant_code:'J2G-'+Math.random().toString(36).slice(2,8).toUpperCase(),name:$('cn').value.trim(),species:p.species||'',variety:p.variety||'',cost:0,ownership_type:p.ownership_type||'Sale',sale_price:0,status:'Owned',location:p.location||'',notes:$('cno').value,parent_plant_id:p.id};try{await api('/plants',{method:'POST',body:JSON.stringify(d)});closeModal();await load()}catch(e){alert('Could not create cutting: '+e.message)}}}
async function move(id){let p=plants.find(x=>x.id===id),v=prompt('Sale price (£)',p?.sale_price||'');if(v===null)return;try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:Number(v)})});await load()}catch(e){alert(e.message)}}async function sell(id){let p=plants.find(x=>x.id===id),v=prompt('Actual sale price (£)',p?.sale_price||'');if(v===null)return;let buyer=prompt('Buyer (optional)','')||'';try{await api('/sales',{method:'POST',body:JSON.stringify({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:Number(v),cost:Number(p.cost||0),buyer,channel:'Direct',notes:'J2Grows'})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'Sold'})});await load()}catch(e){alert(e.message)}}function salesPage(){let rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),prof=sales.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0),0);main.innerHTML=header('Sales','Your completed Sale-plant transactions.')+'<div class="cards"><div class="card"><div class="label">Sales</div><div class="metric">'+sales.length+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric gold">'+money(rev)+'</div></div><div class="card"><div class="label">Gross Profit</div><div class="metric green">'+money(prof)+'</div></div><div class="card"><div class="label">For Sale</div><div class="metric">'+plants.filter(p=>p.ownership_type==='Sale'&&p.status==='For Sale').length+'</div></div></div><section class="panel">'+(sales.length?'<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Plant</th><th>Sale</th><th>Cost</th><th>Profit</th></tr>'+sales.map(s=>'<tr><td>'+esc(s.sale_date)+'</td><td>'+esc(s.plant_name)+'</td><td>'+money(s.sale_price)+'</td><td>'+money(s.cost)+'</td><td class="green">'+money(Number(s.sale_price)-Number(s.cost))+'</td></tr>').join('')+'</table></div>':'<div class="empty">No completed sales yet.</div>')+'</section>'}function propPage(){main.innerHTML=header('Propagation','Create new plants from your collection.')+'<section class="panel"><div class="empty">Use ✂ on any plant to create a propagated plant.</div></section>'}function dash(){let per=plants.filter(p=>p.ownership_type==='Personal'),sal=plants.filter(p=>p.ownership_type==='Sale'),rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),prof=sales.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0),0),inv=sal.filter(p=>p.status!=='Sold').reduce((a,p)=>a+Number(p.sale_price||p.current_value||0),0);main.innerHTML=header('Dashboard','Your collection and J2Grows business at a glance.')+'<div class="cards"><div class="card"><div class="label">All Plants</div><div class="metric">'+plants.length+'</div></div><div class="card"><div class="label">Personal</div><div class="metric blue">'+per.length+'</div></div><div class="card"><div class="label">Sale Stock</div><div class="metric gold">'+sal.length+'</div></div><div class="card"><div class="label">Inventory Value</div><div class="metric">'+money(inv)+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric green">'+money(rev)+'</div></div><div class="card"><div class="label">Gross Profit</div><div class="metric green">'+money(prof)+'</div></div></div><section class="panel"><h2>Personal vs Sale</h2><p class="sub">Personal plants remain collection assets. Sale plants power inventory, sales and profit metrics.</p></section>'}load();</script></body></html>
