<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows · Sign in</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100a;color:#f4faf5;font-family:Inter,system-ui,sans-serif}.shell{width:min(460px,calc(100% - 32px));padding:34px;border:1px solid #315c3b;border-radius:28px;background:linear-gradient(180deg,#10251af7,#07120cf7);box-shadow:0 40px 120px #000c}.logo{font-size:42px}.ey{color:#6df08e;font-size:10px;font-weight:950;letter-spacing:.18em}.title{font-size:32px;font-weight:950;margin:6px 0 8px}.sub{color:#8fa797;line-height:1.5;margin-bottom:22px}.tabs{display:flex;gap:7px;margin-bottom:18px}.tab{flex:1;border:1px solid #274c32;background:#0b1810;color:#8fa797;padding:11px;border-radius:11px;font-weight:900;cursor:pointer}.tab.active{background:#6df08e;color:#06210b}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#8fa797;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.input{width:100%;box-sizing:border-box;background:#07120b;color:#fff;border:1px solid #274c32;padding:13px;border-radius:11px;outline:none}.input:focus{border-color:#6df08e}.submit{width:100%;border:0;background:linear-gradient(135deg,#aaffb9,#55db79);color:#05210b;padding:13px;border-radius:11px;font-weight:950;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.55;cursor:wait}.error{min-height:20px;color:#ff8178;font-size:12px;margin-top:10px}.success{min-height:20px;color:#6df08e;font-size:12px;margin-top:10px}.hint{color:#607668;font-size:10px;line-height:1.5;margin-top:18px}</style></head><body><main class="shell"><div class="logo">🌱</div><div class="ey">J2GROWS COMMAND CENTRE</div><div class="title" id="title">Create your database</div><div class="sub" id="sub">Create an account and name your private plant database.</div><div class="tabs"><button type="button" class="tab active" id="signupTab">Create account</button><button type="button" class="tab" id="loginTab">Sign in</button></div><form id="form"><div class="field" id="dbWrap"><label>Database name</label><input class="input" id="db" placeholder="e.g. Joe's Plant Database" maxlength="60"></div><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input class="input" id="password" type="password" minlength="6" required></div><button class="submit" id="submit" type="submit">Create my database</button><div class="error" id="error"></div><div class="success" id="success"></div></form><div class="hint">Your plants and sales are tied to your account. Other users cannot access your private workspace.</div></main><script>const URL='https://fikyexmwwvlggeosolfe.supabase.co',KEY='sb_publishable_rIqVXBE087N83L4LKBHdSw_nhvj1XiG',sb=supabase.createClient(URL,KEY);let signup=true;const $=id=>document.getElementById(id);function mode(v){signup=v;$('signupTab').classList.toggle('active',v);$('loginTab').classList.toggle('active',!v);$('dbWrap').style.display=v?'grid':'none';$('title').textContent=v?'Create your database':'Welcome back';$('sub').textContent=v?'Create an account and name your private plant database.':'Sign in to open your private plant database.';$('submit').textContent=v?'Create my database':'Sign in';$('error').textContent='';$('success').textContent=''}$('signupTab').onclick=()=>mode(true);$('loginTab').onclick=()=>mode(false);async function saveProfile(user,name){if(!user||!name||!name.trim())return;const {error}=await sb.from('profiles').upsert({id:user.id,email:user.email,database_name:name.trim(),updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error}sb.auth.getSession().then(async({data})=>{if(data.session){try{const {data:p}=await sb.from('profiles').select('database_name').eq('id',data.session.user.id).maybeSingle();if(p&&p.database_name)location.replace('app-v4.html');else mode(true)}catch(e){mode(true)}}});$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('success').textContent='';$('submit').disabled=true;try{let r;if(signup){const name=$('db').value.trim();if(!name)throw Error('Please give your database a name.');r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{database_name:name}}});if(r.error)throw r.error;if(!r.data.session){$('success').textContent='Account created. Check your email to confirm the account, then use Sign in here.';mode(false);$('success').textContent='Account created. Check your email to confirm the account, then sign in here.';return}await saveProfile(r.data.user,name)}else{r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const {data:p,error:pe}=await sb.from('profiles').select('database_name').eq('id',r.data.user.id).maybeSingle();if(pe)throw pe;let name=p?.database_name||r.data.user.user_metadata?.database_name||'';if(!name)name=prompt('Name your plant database','My Plant Database')||'';if(!name.trim())throw Error('Please enter a database name.');await saveProfile(r.data.user,name)}location.replace('app-v4.html')}catch(err){let msg=err.message||'Unable to authenticate.';if(/email not confirmed/i.test(msg))msg='Your email has not been confirmed yet. Check your inbox for the confirmation email, then sign in again.';$('error').textContent=msg}finally{$('submit').disabled=false}};</script></body></html>
