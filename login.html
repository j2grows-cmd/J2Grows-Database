<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J2Grows · Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#06100a;color:#f4faf5;font-family:Inter,system-ui,sans-serif}.shell{width:min(480px,100%);padding:34px;border:1px solid #315c3b;border-radius:28px;background:linear-gradient(180deg,#10251af7,#07120cf7);box-shadow:0 40px 120px #000c}.logo{font-size:42px}.ey{color:#6df08e;font-size:10px;font-weight:950;letter-spacing:.18em}.title{font-size:32px;font-weight:950;margin:6px 0 8px}.sub{color:#8fa797;line-height:1.5;margin-bottom:22px}.tabs{display:flex;gap:7px;margin-bottom:18px}.tab{flex:1;border:1px solid #274c32;background:#0b1810;color:#8fa797;padding:12px;border-radius:11px;font-weight:900;cursor:pointer}.tab.active{background:#6df08e;color:#06210b}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#8fa797;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.input{width:100%;background:#07120b;color:#fff;border:1px solid #274c32;padding:13px;border-radius:11px;outline:none}.input:focus{border-color:#6df08e;box-shadow:0 0 0 3px #6df08e18}.submit{width:100%;border:0;background:linear-gradient(135deg,#aaffb9,#55db79);color:#05210b;padding:14px;border-radius:11px;font-weight:950;cursor:pointer;margin-top:8px}.submit:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:12px;padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.45}.message.show{display:block}.error{background:#35130f;color:#ffaaa3;border:1px solid #71352e}.success{background:#102d18;color:#91f3a8;border:1px solid #2d7040}.status{margin-top:12px;color:#587060;font-size:10px;text-align:center}.hint{color:#607668;font-size:10px;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main class="shell">
<div class="logo">🌱</div><div class="ey">J2GROWS COMMAND CENTRE</div>
<div class="title" id="title">Create your database</div><div class="sub" id="sub">Create an account and name your private plant database.</div>
<div class="tabs"><button type="button" class="tab active" id="signupTab">Create account</button><button type="button" class="tab" id="loginTab">Sign in</button></div>
<form id="form" novalidate>
<div class="field" id="dbWrap"><label for="db">Database name</label><input class="input" id="db" autocomplete="organization" placeholder="e.g. Joe's Plant Database" maxlength="60"></div>
<div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
<button class="submit" id="submit" type="submit">Create my database</button>
<div class="message error" id="error"></div><div class="message success" id="success"></div>
</form>
<div class="status" id="status">Connecting to J2Grows authentication…</div><div class="hint">Your plants and sales are tied to your account. Other users cannot access your private workspace.</div>
</main>
<script>
(()=>{
const SUPABASE_URL='https://fikyexmwwvlggeosolfe.supabase.co';
const SUPABASE_KEY='sb_publishable_rIqVXBE087N83L4LKBHdSw_nhvj1XiG';
const $=id=>document.getElementById(id);let signup=true,sb=null;
function message(el,text){el.textContent=text;el.classList.toggle('show',!!text)}
function setMode(v){signup=v;$('signupTab').classList.toggle('active',v);$('loginTab').classList.toggle('active',!v);$('dbWrap').style.display=v?'grid':'none';$('title').textContent=v?'Create your database':'Welcome back';$('sub').textContent=v?'Create an account and name your private plant database.':'Sign in to open your private plant database.';$('submit').textContent=v?'Create my database':'Sign in';$('password').autocomplete=v?'new-password':'current-password';message($('error'),'');message($('success'),'')}
$('signupTab').onclick=()=>setMode(true);$('loginTab').onclick=()=>setMode(false);
async function saveProfile(user,name){if(!user||!name?.trim())return;const {error}=await sb.from('profiles').upsert({id:user.id,email:user.email,database_name:name.trim(),updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error}
async function finish(session){
 if(!session)throw Error('Supabase did not return a login session. If email confirmation is enabled, confirm your email first.');
 /* Authentication is successful at this point. Never block login because a profile row is missing. */
 let name=session.user.user_metadata?.database_name||'';
 try{const {data:p}=await sb.from('profiles').select('database_name').eq('id',session.user.id).maybeSingle();if(p?.database_name)name=p.database_name}catch(_){/* profile may not exist yet */}
 if(!name){name=prompt('Name your plant database','My Plant Database')||'';if(name.trim()){try{await saveProfile(session.user,name)}catch(_){/* app auth can repair it later */}}}
 location.replace('app-v4.html');
}
$('form').onsubmit=async e=>{e.preventDefault();message($('error'),'');message($('success'),'');const mail=$('email').value.trim(),pass=$('password').value,name=$('db').value.trim();if(!mail)return message($('error'),'Please enter your email address.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return message($('error'),'Please enter a valid email address.');if(pass.length<6)return message($('error'),'Your password must be at least 6 characters.');if(signup&&!name)return message($('error'),'Please give your database a name.');$('submit').disabled=true;$('submit').textContent=signup?'Creating account…':'Signing in…';try{
 if(signup){const {data,error}=await sb.auth.signUp({email:mail,password:pass,options:{data:{database_name:name},emailRedirectTo:window.location.origin+'/J2Grows-Database/login.html'}});if(error)throw error;if(!data.session){setMode(false);$('email').value=mail;message($('success'),'Account created. Check your email to confirm the account, then click Sign in.');return}try{await saveProfile(data.user,name)}catch(_){}await finish(data.session)}
 else {const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass});if(error)throw error;await finish(data.session)}
 }catch(err){let text=err?.message||'Authentication failed.';if(/email not confirmed/i.test(text))text='Your email has not been confirmed. Check your inbox, confirm the account, then try Sign in again.';if(/invalid login credentials/i.test(text))text='Email or password is incorrect.';message($('error'),text)}finally{$('submit').disabled=false;$('submit').textContent=signup?'Create my database':'Sign in'}};
function boot(){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);$('status').textContent='Authentication ready';sb.auth.getSession().then(async({data,error})=>{if(error)return message($('error'),error.message);if(data.session){try{await finish(data.session)}catch(e){message($('error'),e.message)}}}).catch(e=>message($('error'),e.message))}catch(e){message($('error'),'Authentication could not start: '+e.message);$('status').textContent='Authentication unavailable'}}
if(window.supabase)boot();else setTimeout(()=>{if(!window.supabase){message($('error'),'The authentication library did not load. Please reload the page.');$('status').textContent='Authentication library unavailable'}},5000);
})();
</script>
</body>
</html>
