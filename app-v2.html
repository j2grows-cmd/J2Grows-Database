<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows Database</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07110c;--p:#102018;--p2:#14291c;--l:#284633;--t:#f5f8f5;--m:#91a799;--g:#7ee787;--r:#ff7b72;--gold:#e3b341}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173b25,transparent 32%),var(--bg);color:var(--t);font:14px system-ui,sans-serif}.layout{display:flex;min-height:100vh}.side{width:230px;background:#07110bf2;border-right:1px solid var(--l);padding:20px 14px}.brand{font-size:20px;font-weight:900;padding:8px 10px 28px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#c5ffc9,#3fb950);margin-right:8px;color:#08220e}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:var(--m);padding:12px;border-radius:10px;text-align:left;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:var(--p2);color:var(--t)}main{flex:1;padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:20px}.ey{color:var(--g);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.title{font-size:30px;font-weight:900}.sub,.muted{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select,textarea{font:inherit;border:1px solid var(--l);background:#08150d;color:var(--t);padding:10px;border-radius:9px}.btn{cursor:pointer;font-weight:750}.btn:hover{border-color:#4b7457}.primary{background:var(--g);border-color:var(--g);color:#06200b}.danger{color:#ffaaa4}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:linear-gradient(180deg,#11241a,#0b1911);border:1px solid var(--l);border-radius:15px;padding:16px}.label{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.metric{font-size:26px;font-weight:900;margin:5px 0}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:15px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--m);text-transform:uppercase}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#193522;color:#a9efb3;font-size:11px}.tag.sale{background:#3b2d13;color:#f3ca73}.tag.sold{background:#321a18;color:#ffaaa4}.empty{text-align:center;padding:40px;color:var(--m)}.search{min-width:220px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.hidden{display:none}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b1911;border:1px solid var(--l);border-radius:18px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--m);font-weight:700}.full{grid-column:1/-1}textarea{min-height:90px;resize:vertical}.close{border:0;background:transparent;color:var(--m);font-size:25px;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#183321;border:1px solid #3f6b4a;padding:13px 16px;border-radius:10px;z-index:30}.hidden{display:none!important}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none}main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column;align-items:flex-start}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="logo">🌱</span>J2Grows</div><nav class="nav"><button onclick="show('dashboard')">◈ Dashboard</button><button onclick="show('plants')">🌿 My Plants</button><button onclick="show('sales')">£ Sales</button><button onclick="show('prop')">✂️ Propagation</button></nav></aside><main id="main"></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script>const URL='https://izsjxfigndqkuarooequ.supabase.co',KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';let db=null,plants=[],sales=[],props=[],page='dashboard';const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function database(){if(!db){if(!window.supabase){throw new Error('The database library has not loaded yet. Refresh the page and try again.')}db=window.supabase.createClient(URL,KEY)}return db}function msg(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}async function load(){try{const d=database();const [a,b,c]=await Promise.all([d.from('plants').select('*').order('created_at',{ascending:false}),d.from('sales').select('*').order('sale_date',{ascending:false}),d.from('propagations').select('*').order('created_at',{ascending:false})]);if(a.error||b.error||c.error)throw(a.error||b.error||c.error);plants=a.data||[];sales=b.data||[];props=c.data||[];render()}catch(e){render();msg('Database connection error: '+e.message)}}function show(p){page=p;render()}function head(t,s,actions=''){return `<div class="top"><div><div class="ey">J2Grows Database</div><div class="title">${t}</div><div class="sub">${s}</div></div><div class="actions">${actions}</div></div>`}function status(s){return `<span class="tag ${s==='Sold'?'sold':s==='For Sale'?'sale':''}">${esc(s)}</span>`}function plantRows(list){if(!list.length)return `<div class="empty">No plants yet.<br><br><button class="btn primary" onclick="plantForm()">+ Add your first plant</button></div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Sale</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</div></td><td>${esc(p.purchase_source||'—')}</td><td>${money(p.cost)}</td><td>${p.sale_price?money(p.sale_price):'—'}</td><td>${status(p.status)}</td><td><div class="actions"><button class="btn" onclick="plantForm('${p.id}')">Edit</button>${p.status!=='Sold'?`<button class="btn" onclick="cutForm('${p.id}')">✂ Cut</button>`:''}${p.status!=='Sold'&&p.status!=='For Sale'?`<button class="btn" onclick="toSale('${p.id}')">£ Move to sales</button>`:''}${p.status==='For Sale'?`<button class="btn primary" onclick="saleForm('${p.id}')">Sell</button>`:''}<button class="btn danger" onclick="removePlant('${p.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}function saleRows(list){if(!list.length)return '<div class="empty">No completed sales yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Buyer</th><th>Channel</th><th>Price</th><th>Profit</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(s.plant_name)}</td><td>${esc(s.buyer||'—')}</td><td>${esc(s.channel||'—')}</td><td>${money(s.sale_price)}</td><td>${money(Number(s.sale_price)-Number(s.cost))}</td></tr>`).join('')}</tbody></table></div>`}function render(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['dashboard','plants','sales','prop'][i]===page));if(page==='dashboard'){const rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0),inv=plants.filter(p=>p.status!=='Sold').reduce((a,p)=>a+Number(p.cost||0),0);$('main').innerHTML=head('Dashboard','Your plants, propagation and sales.',`<button class="btn primary" onclick="plantForm()">+ Add plant</button>`)+`<div class="cards"><div class="card"><div class="label">Plants</div><div class="metric">${plants.length}</div></div><div class="card"><div class="label">For sale</div><div class="metric">${plants.filter(p=>p.status==='For Sale').length}</div></div><div class="card"><div class="label">Propagations</div><div class="metric">${props.length}</div></div><div class="card"><div class="label">Revenue</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="label">Inventory cost</div><div class="metric">${money(inv)}</div></div></div><div class="grid"><section class="panel"><div class="panelhead"><h2>Plants</h2><button class="btn" onclick="show('plants')">View all</button></div>${plantRows(plants.slice(0,8))}</section><section class="panel"><div class="panelhead"><h2>Recent sales</h2></div>${saleRows(sales.slice(0,8))}<p class="muted">Total profit: <b>${money(rev-cost)}</b></p></section></div>`}else if(page==='plants'){$('main').innerHTML=head('My Plants','Everything you own and its current value.',`<input id="q" class="search" placeholder="Search…" oninput="filter()"><button class="btn primary" onclick="plantForm()">+ Add plant</button>`)+`<section class="panel" id="plantList">${plantRows(plants)}</section>`}else if(page==='sales'){$('main').innerHTML=head('Sales','Plants moved into the sales pipeline and completed sales.',`<button class="btn primary" onclick="saleForm()">+ Complete sale</button>`)+`<section class="panel"><h2>For sale</h2>${plantRows(plants.filter(p=>p.status==='For Sale'))}</section><section class="panel" style="margin-top:15px"><h2>Completed sales</h2>${saleRows(sales)}</section>`}else{$('main').innerHTML=head('Propagation','Track cuttings and their parent plants.',`<button class="btn primary" onclick="cutForm()">+ Propagate / Cut</button>`)+`<section class="panel">${props.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Type</th><th>New plant</th><th>Notes</th></tr></thead><tbody>${props.map(x=>{const p=plants.find(z=>z.id===x.plant_id),c=plants.find(z=>z.id===x.child_plant_id);return `<tr><td>${esc(x.propagated_at)}</td><td>${esc(p?.name||'Unknown')}</td><td>${esc(x.propagation_type)}</td><td>${esc(c?.name||'—')}</td><td>${esc(x.notes||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No propagations yet.</div>'}</section>`}}function filter(){const q=($('q')?.value||'').toLowerCase();$('plantList').innerHTML=plantRows(plants.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}function openModal(html){$('modal').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}function plantForm(id=''){const p=plants.find(x=>x.id===id)||{};openModal(`<div class="box"><div class="panelhead"><h2>${id?'Edit':'Add'} plant</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlant(event,'${id}')"><div class="formgrid"><div class="field"><label>Name *</label><input id="n" required value="${esc(p.name||'')}" placeholder="Monstera Thai Constellation"></div><div class="field"><label>Species</label><input id="sp" value="${esc(p.species||'')}"></div><div class="field"><label>Variety / cultivar</label><input id="va" value="${esc(p.variety||'')}"></div><div class="field"><label>Status</label><select id="st">${['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Where did you get it?</label><input id="src" value="${esc(p.purchase_source||'')}" placeholder="Shop, eBay, Facebook…"></div><div class="field"><label>Cost (£)</label><input id="co" type="number" step="0.01" min="0" value="${esc(p.cost||0)}"></div><div class="field"><label>Purchase date</label><input id="dt" type="date" value="${esc(p.purchase_date||'')}"></div><div class="field"><label>Location</label><input id="loc" value="${esc(p.location||'')}" placeholder="Greenhouse / shelf"></div><div class="field"><label>Target sale price (£)</label><input id="sale" type="number" step="0.01" min="0" value="${esc(p.sale_price||0)}"></div><div class="field full"><label>Notes</label><textarea id="no">${esc(p.notes||'')}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>`)}async function savePlant(e,id){e.preventDefault();try{const data={name:$('n').value.trim(),species:$('sp').value.trim(),variety:$('va').value.trim(),status:$('st').value,purchase_source:$('src').value.trim(),cost:Number($('co').value||0),purchase_date:$('dt').value||null,location:$('loc').value.trim(),sale_price:Number($('sale').value||0),notes:$('no').value.trim()};const d=database(),r=id?await d.from('plants').update(data).eq('id',id):await d.from('plants').insert({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data});if(r.error)throw r.error;closeModal();msg(id?'Plant updated':'Plant added');await load()}catch(x){alert('Could not save plant: '+x.message)}}async function toSale(id){const p=plants.find(x=>x.id===id);const v=prompt('Sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price.');try{const r=await database().from('plants').update({status:'For Sale',sale_price:price,moved_to_sales_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;msg('Moved to sales');await load()}catch(x){alert(x.message)}}function saleForm(id=''){const choices=plants.filter(p=>p.status!=='Sold'),p=plants.find(x=>x.id===id)||choices.find(x=>x.status==='For Sale')||choices[0];if(!p)return alert('Add a plant first.');openModal(`<div class="box"><div class="panelhead"><h2>Complete sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="formgrid"><div class="field full"><label>Plant</label><select id="pid">${choices.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)} — ${esc(x.status)}</option>`).join('')}</select></div><div class="field"><label>Sale price (£)</label><input id="price" required type="number" step="0.01" min="0" value="${esc(p.sale_price||0)}"></div><div class="field"><label>Cost (£)</label><input id="scost" type="number" step="0.01" min="0" value="${esc(p.cost||0)}"></div><div class="field"><label>Date</label><input id="sdate" type="date" value="${today()}"></div><div class="field"><label>Buyer</label><input id="buyer"></div><div class="field"><label>Channel</label><input id="channel" placeholder="Direct / eBay / Etsy…"></div><div class="field full"><label>Notes</label><textarea id="snotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Record sale</button></div></form></div>`)}async function saveSale(e){e.preventDefault();try{const p=plants.find(x=>x.id===$('pid').value);const sale={plant_id:p.id,plant_name:p.name,sale_date:$('sdate').value||today(),sale_price:Number($('price').value||0),cost:Number($('scost').value||p.cost||0),buyer:$('buyer').value.trim(),channel:$('channel').value.trim(),notes:$('snotes').value.trim()};const d=database(),r=await d.from('sales').insert(sale);if(r.error)throw r.error;const u=await d.from('plants').update({status:'Sold',sale_price:sale.sale_price,sale_date:sale.sale_date}).eq('id',p.id);if(u.error)throw u.error;closeModal();msg('Sale recorded');await load()}catch(x){alert('Could not record sale: '+x.message)}}function cutForm(parentId=''){const choices=plants.filter(p=>p.status!=='Sold'),p=plants.find(x=>x.id===parentId)||choices[0];if(!p)return alert('Add a plant first.');openModal(`<div class="box"><div class="panelhead"><h2>Propagate / Cut</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveCut(event)"><div class="formgrid"><div class="field full"><label>Parent plant</label><select id="parent">${choices.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)} — ${esc(x.plant_code)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="ptype"><option>Cutting</option><option>Node cutting</option><option>Top cutting</option><option>Division</option><option>Offset</option><option>Leaf</option><option>Seed</option></select></div><div class="field"><label>Date</label><input id="pdate" type="date" value="${today()}"></div><div class="field"><label>New plant name</label><input id="child" value="${esc(p.name+' cutting')}"></div><div class="field"><label>Starting sale price (£)</label><input id="childprice" type="number" step="0.01" min="0" value="0"></div><div class="field full"><label>Notes</label><textarea id="pnotes" placeholder="Node count, rooting medium, etc."></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create cutting</button></div></form></div>`)}async function saveCut(e){e.preventDefault();try{const p=plants.find(x=>x.id===$('parent').value),d=database();const child={plant_code:'PL-'+Date.now().toString(36).toUpperCase(),name:$('child').value.trim()||p.name+' cutting',species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.plant_code,purchase_date:$('pdate').value||today(),location:p.location,sale_price:Number($('childprice').value||0),notes:'Child of '+p.name};const ins=await d.from('plants').insert({parent_plant_id:p.id,...child}).select().single();if(ins.error)throw ins.error;const pr=await d.from('propagations').insert({plant_id:p.id,child_plant_id:ins.data.id,propagation_type:$('ptype').value,propagated_at:$('pdate').value||today(),notes:$('pnotes').value.trim()});if(pr.error){await d.from('plants').delete().eq('id',ins.data.id);throw pr.error}await d.from('plants').update({propagation_count:Number(p.propagation_count||0)+1}).eq('id',p.id);closeModal();msg('Cutting created');await load()}catch(x){alert('Could not create cutting: '+x.message)}}async function removePlant(id){if(!confirm('Delete this plant?'))return;try{const r=await database().from('plants').delete().eq('id',id);if(r.error)throw r.error;await load()}catch(x){alert(x.message)}}function init(){render();load()}init();</script></body></html>
