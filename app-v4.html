date').value,sold_at:new Date().toISOString()})});closeModal();await load()}catch(e){alert('Could not complete sale: '+e.message)}}function propForm(id){const p=plants.find(x=>x.id===id);openModal('<div class="box"><div class="mh"><h2>Propagate '+esc(p.name)+'</h2><button class="close" onclick="closeModal()">×</button></div><form class="form" onsubmit="createPropagation(event,\''+id+'\')"><div class="field"><label>New plant name</label><input class="input" id="pr_name" value="'+esc(p.name+' Cutting')+'" required></div><div class="field"><label>Propagation type</label><select class="select" id="pr_type"><option>Node cutting</option><option>Top cutting</option><option>Stem cutting</option><option>Division</option><option>Offset</option><option>Seed</option></select></div><div class="field full"><label>Notes</label><textarea class="textarea" id="pr_notes"></textarea></div><div class="actions" style="grid-column:1/-1;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create Plant</button></div></form></div>')}async function createPropagation(e,id){e.preventDefault();const p=plants.find(x=>x.id===id);try{await api('/plants',{method:'POST',body:JSON.stringify({name:$('pr_name').value,species:p.species,variety:p.variety,ownership_type:p.ownership_type,cost:0,current_value:0,source:'Propagation from '+p.name,parent_plant_id:id,lifecycle_stage:'Growing',status:'Owned',notes:$('pr_type').value+': '+$('pr_notes').value})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({propagation_count:Number(p.propagation_count||0)+1,lifecycle_stage:'Propagated',status:'Growing'})});closeModal();await load()}catch(e){alert('Could not create propagation: '+e.message)}}function dashboard(){const sale=plants.filter(p=>p.ownership_type==='Sale'&&p.status!=='Sold'),rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),profit=sales.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0)-Number(s.platform_fee||0)-Number(s.postage_cost||0)-Number(s.packaging_cost||0)-Number(s.other_cost||0),0);main.innerHTML=header('Dashboard','Your J2Grows command centre.')+'<div class="cards"><div class="card"><div class="label">Plants</div><div class="metric">'+plants.length+'</div></div><div class="card"><div class="label">Sale Inventory</div><div class="metric gold">'+money(sale.reduce((a,p)=>a+Number(p.sale_price||0),0))+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric">'+money(rev)+'</div></div><div class="card"><div class="label">Net Profit</div><div class="metric blue">'+money(profit)+'</div></div></div><section class="panel"><h3>Lifecycle snapshot</h3>'+['Acquired','Growing','Propagated','For Sale','Reserved','Sold'].map(s=>'<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #193322"><span>'+s+'</span><b>'+plants.filter(p=>(p.lifecycle_stage||p.status)===s).length+'</b></div>').join('')+'</section>'}function salesPage(){const active=plants.filter(p=>p.ownership_type==='Sale'&&(p.status==='For Sale'||p.status==='Reserved')),sold=sales;main.innerHTML=header('Sales','Manage listings, reservations and completed sales.')+'<div class="cards"><div class="card"><div class="label">For Sale</div><div class="metric gold">'+active.length+'</div></div><div class="card"><div class="label">Revenue</div><div class="metric">'+money(sold.reduce((a,s)=>a+Number(s.sale_price||0),0))+'</div></div><div class="card"><div class="label">Sales</div><div class="metric">'+sold.length+'</div></div><div class="card"><div class="label">Profit</div><div class="metric blue">'+money(sold.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0)-Number(s.platform_fee||0)-Number(s.postage_cost||0)-Number(s.packaging_cost||0)-Number(s.other_cost||0),0))+'</div></div></div><section class="panel"><h3>Active listings</h3><p class="sub">For Sale and Reserved stock. Open a plant to reserve or complete the sale.</p>'+table(active)+'</section><section class="panel" style="margin-top:14px"><h3>Completed sales</h3><div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Date</th><th>Sale</th><th>Costs</th><th>Profit</th><th>Channel</th></tr></thead><tbody>'+sold.map(s=>'<tr><td>'+esc(s.plant_name)+'</td><td>'+esc(s.sale_date||'')+'</td><td>'+money(s.sale_price)+'</td><td>'+money(Number(s.cost||0)+Number(s.platform_fee||0)+Number(s.postage_cost||0)+Number(s.packaging_cost||0)+Number(s.other_cost||0))+'</td><td class="blue">'+money(Number(s.sale_price||0)-Number(s.cost||0)-Number(s.platform_fee||0)-Number(s.postage_cost||0)-Number(s.packaging_cost||0)-Number(s.other_cost||0))+'</td><td>'+esc(s.channel||'—')+'</td></tr>').join('')+'</tbody></table></div></section>'}function propPage(){const roots=plants.filter(p=>!p.parent_plant_id),cuts=plants.filter(p=>p.parent_plant_id);main.innerHTML=header('Propagation','Track every cutting and where it came from.')+'<div class="cards"><div class="card"><div class="label">Propagated Plants</div><div class="metric">'+cuts.length+'</div></div><div class="card"><div class="label">Parent Plants</div><div class="metric">'+roots.filter(p=>Number(p.propagation_count||0)>0).length+'</div></div></div><section class="panel"><h3>Family relationships</h3>'+cuts.map(c=>{const p=plants.find(x=>x.id===c.parent_plant_id);return '<div class="tree" style="margin:8px 0"><button class="node" onclick="profile(\''+(p?.id||c.id)+'\')">🌿 '+esc(p?.name||'Unknown parent')+'</button><span>→</span><button class="node" onclick="profile(\''+c.id+'\')">🌱 '+esc(c.name)+'</button></div>'}).join('')+'</section>'}load();</script><script id="j2grows-image-upload">
(() => {
  const MAX_BYTES = 1200 * 1024;
  const IMAGE_TYPES = /^image\//i;
  function makeUpload(input) {
    if (!input || input.dataset.j2Upload === '1') return;
    input.dataset.j2Upload = '1';
    input.type = 'hidden';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px';
    const file = document.createElement('input');
    file.type = 'file'; file.accept = 'image/*';
    file.style.cssText = 'max-width:100%';
    const status = document.createElement('span');
    status.style.cssText = 'font-size:12px;opacity:.7';
    const preview = document.createElement('img');
    preview.style.cssText = 'width:72px;height:72px;object-fit:cover;border-radius:14px;display:none;border:1px solid rgba(255,255,255,.12)';
    wrap.append(file, status, preview);
    input.parentElement.appendChild(wrap);
    const resize = (f) => new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = reject;
      r.onload = () => { const img = new Image(); img.onload = () => {
        const max = 1400, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/webp', .82));
      }; img.onerror = reject; img.src = r.result; };
      r.readAsDataURL(f);
    });
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0]; if (!f) return;
      if (!IMAGE_TYPES.test(f.type)) { alert('Please choose an image file.'); file.value=''; return; }
      if (f.size > 12*1024*1024) { alert('Please choose an image smaller than 12 MB.'); file.value=''; return; }
      status.textContent = 'Processing image…';
      try {
        const data = await resize(f);
        if (data.length > MAX_BYTES * 1.37) { alert('That image is still too large after compression. Please choose a smaller image.'); status.textContent=''; return; }
        input.value = data;
        preview.src = data; preview.style.display='block';
        status.textContent = 'Image ready';
      } catch (e) { console.error(e); status.textContent='Could not process image'; }
    });
    if (input.value && input.value.startsWith('data:image/')) { preview.src=input.value; preview.style.display='block'; status.textContent='Current image'; }
  }
  function init() {
    document.querySelectorAll('input[name="photo_url"], input#photo_url, input[name="photoUrl"], input#photoUrl, input#f_photo, input#f_photo').forEach(makeUpload);
  }
  new MutationObserver(init).observe(document.documentElement, {childList:true,subtree:true});
  init();
})();
</script>
