<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows Database</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06100b;--panel:#0d1b13;--panel2:#11251a;--line:#20392a;--text:#f4f8f4;--muted:#8da494;--green:#7ee787;--gold:#e3b341;--red:#ff7b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173b25,transparent 32%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.layout{display:flex;min-height:100vh}.side{width:235px;border-right:1px solid var(--line);background:#07110bea;padding:22px 14px}.brand{font-size:20px;font-weight:900;padding:6px 10px 28px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#c5ffc9,#3fb950);margin-right:9px;color:#08220e}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:10px;text-align:left;cursor:pointer;font:inherit}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}main{flex:1;max-width:1500px;width:100%;padding:28px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.ey{color:var(--green);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800}.title{font-size:30px;font-weight:900}.sub,.mini{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select,textarea{font:inherit;border:1px solid var(--line);background:#08150d;color:var(--text);padding:10px;border-radius:9px}.btn{font-weight:750;cursor:pointer}.btn:hover{border-color:#3b6449}.primary{background:var(--green);color:#06200b;border-color:var(--green)}.danger{color:#ffaaa4}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:linear-gradient(180deg,#11241aee,#0b1911ee);border:1px solid var(--line);border-radius:15px;padding:16px}.metric{font-size:26px;font-weight:900;margin-top:5px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:15px}.panel{padding:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.panel h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.tag{padding:4px 8px;border-radius:999px;background:#193522;color:#a9efb3;font-size:11px}.sale{background:#3b2d13;color:#f3ca73}.sold{background:#321a18;color:#ffaaa4}.search{min-width:230px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:700}.full{grid-column:1/-1}textarea{min-height:90px;resize:vertical}.empty{text-align:center;padding:45px;color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b1911;border:1px solid var(--line);border-radius:18px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.close{border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.profit{color:var(--green);font-weight:800}.gold{color:var(--gold);font-weight:800}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="layout"><aside class="side"><div class="brand"><span class="logo">🌱</span>J2Grows</div><nav class="nav"><button data-view="dashboard">◈ &nbsp;Dashboard</button><button data-view="plants">🌿 &nbsp;My Plants</button><button data-view="sales">£ &nbsp;Sales</button><button data-view="propagation">✂️ &nbsp;Propagation</button></nav></aside><main id="app"></main></div><div id="modal" class="modal hidden"></div>
<script>
const SUPABASE_URL='https://izsjxfigndqkuarooequ.supabase.co';const SUPABASE_KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let plants=[],sales=[],props=[],view='dashboard';const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [a,b,c]=await Promise.all([db.from('plants').select('*').order('created_at',{ascending:false}),db.from('sales').select('*').order('sale_date',{ascending:false}),db.from('propagations').select('*').order('created_at',{ascending:false})]);const err=a.error||b.error||c.error;if(err){alert('Database error: '+err.message);return}plants=a.data||[];sales=b.data||[];props=c.data||[];render()}
function setView(v){view=v;render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function top(title,sub,actions=''){return `<div class="top"><div><div class="ey">J2Grows Plant Database</div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function status(p){return `<span class="tag ${p.status==='Sold'?'sold':p.status==='For Sale'?'sale':''}">${esc(p.status)}</span>`}
function plantTable(list){if(!list.length)return `<div class="empty">No plants logged yet.<br><br><button class="btn primary" onclick="openPlant()">+ Log your first plant</button></div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Where from</th><th>Cost</th><th>Sale price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mini">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</div></td><td>${esc(p.purchase_source||p.source||'—')}</td><td>${money(p.cost)}</td><td>${p.sale_price?money(p.sale_price):'—'}</td><td>${status(p)}</td><td><div class="actions"><button class="btn" onclick="openPlant('${p.id}')">Edit</button>${p.status!=='Sold'?`<button class="btn" onclick="openProp('${p.id}')">✂ Cut</button>`:''}${p.status!=='Sold'&&p.status!=='For Sale'?`<button class="btn" onclick="moveSale('${p.id}')">£ Move to sales</button>`:''}${p.status==='For Sale'?`<button class="btn primary" onclick="openSale('${p.id}')">Sell</button>`:''}<button class="btn danger" onclick="deletePlant('${p.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function saleTable(list){if(!list.length)return '<div class="empty">No completed sales yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Buyer</th><th>Channel</th><th>Price</th><th>Profit</th><th></th></tr></thead><tbody>${list.map(s=>{const pr=Number(s.sale_price)-Number(s.cost);return `<tr><td>${esc(s.sale_date)}</td><td>${esc(s.plant_name)}</td><td>${esc(s.buyer||'—')}</td><td>${esc(s.channel||'—')}</td><td>${money(s.sale_price)}</td><td class="${pr>=0?'profit':''}">${money(pr)}</td><td><button class="btn" onclick="deleteSale('${s.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const held=plants.filter(p=>p.status!=='Sold').length,forSale=plants.filter(p=>p.status==='For Sale').length,rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0),inventory=plants.filter(p=>p.status!=='Sold').reduce((a,p)=>a+Number(p.cost||0),0);return top('Dashboard','Your collection, propagation and sales in one place.',`<button class="btn primary" onclick="openPlant()">+ Log plant</button>`)+`<div class="cards"><div class="card"><div class="label">Plants</div><div class="metric">${plants.length}</div><div class="sub">${held} held</div></div><div class="card"><div class="label">For sale</div><div class="metric">${forSale}</div><div class="sub">in sales pipeline</div></div><div class="card"><div class="label">Propagations</div><div class="metric">${props.length}</div><div class="sub">cuttings logged</div></div><div class="card"><div class="label">Revenue</div><div class="metric">${money(rev)}</div><div class="sub">${sales.length} completed sales</div></div><div class="card"><div class="label">Inventory cost</div><div class="metric gold">${money(inventory)}</div><div class="sub">cost of plants held</div></div></div><div class="grid"><section class="panel"><div class="panelhead"><h2>Plant collection</h2><button class="btn" onclick="setView('plants')">Manage</button></div>${plantTable(plants.slice(0,8))}</section><section class="panel"><div class="panelhead"><h2>Recent sales</h2><button class="btn" onclick="setView('sales')">All sales</button></div>${saleTable(sales.slice(0,7))}<div style="margin-top:16px"><span class="label">Total profit</span><div class="metric profit">${money(rev-cost)}</div></div></section></div>`}
function plantsView(){return top('My Plants','Log what you own, where it came from, what it cost and what you want to sell it for.',`<input id="search" class="search" placeholder="Search plants…" oninput="filterPlants()"><button class="btn primary" onclick="openPlant()">+ Log plant</button>`)+`<section class="panel" id="plantPanel">${plantTable(plants)}</section>`}function filterPlants(){const q=($('search').value||'').toLowerCase();$('plantPanel').innerHTML=plantTable(plants.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}
function salesView(){const pending=plants.filter(p=>p.status==='For Sale');return top('Sales','Move plants into the sales pipeline, then record the completed transaction.',`<button class="btn primary" onclick="openSale()">+ Complete sale</button>`)+`<section class="panel"><div class="panelhead"><h2>For sale (${pending.length})</h2></div>${pending.length?plantTable(pending):'<div class="empty">Nothing is currently in the sales pipeline.</div>'}</section><section class="panel" style="margin-top:15px"><div class="panelhead"><h2>Completed sales (${sales.length})</h2></div>${saleTable(sales)}</section>`}
function propagationView(){return top('Propagation','Track every cutting and connect it to the parent plant.',`<button class="btn primary" onclick="openProp()">+ Propagate / Cut</button>`)+`<section class="panel">${props.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Parent</th><th>Type</th><th>Child plant</th><th>Notes</th></tr></thead><tbody>${props.map(x=>{const p=plants.find(p=>p.id===x.plant_id),ch=plants.find(p=>p.id===x.child_plant_id);return `<tr><td>${esc(x.propagated_at)}</td><td>${esc(p?.name||'Unknown')}</td><td>${esc(x.propagation_type)}</td><td>${esc(ch?.name||'—')}</td><td>${esc(x.notes||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No propagations logged yet.</div>'}</section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('app').innerHTML=view==='dashboard'?dashboard():view==='plants'?plantsView():view==='sales'?salesView():propagationView()}
function openPlant(id=''){const p=plants.find(x=>x.id===id)||{name:'',species:'',variety:'',status:'Owned',cost:'',purchase_source:'',purchase_date:'',location:'',sale_price:'',notes:''};$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edit plant':'Log a plant'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlant(event,'${id}')"><div class="formgrid"><div class="field"><label>Plant name *</label><input id="name" required value="${esc(p.name)}" placeholder="Monstera Thai Constellation"></div><div class="field"><label>Species</label><input id="species" value="${esc(p.species)}"></div><div class="field"><label>Variety / cultivar</label><input id="variety" value="${esc(p.variety)}"></div><div class="field"><label>Status</label><select id="status">${['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Where did you get it?</label><input id="source" value="${esc(p.purchase_source||p.source||'')}" placeholder="Shop, eBay, Facebook, collector…"></div><div class="field"><label>Cost (£)</label><input id="cost" type="number" step="0.01" min="0" value="${esc(p.cost)}"></div><div class="field"><label>Purchase date</label><input id="date" type="date" value="${esc(p.purchase_date||'')}"></div><div class="field"><label>Location</label><input id="location" value="${esc(p.location||'')}" placeholder="Greenhouse, shelf…"></div><div class="field"><label>Target sale price (£)</label><input id="sale" type="number" step="0.01" min="0" value="${esc(p.sale_price)}"></div><div class="field full"><label>Notes</label><textarea id="notes">${esc(p.notes||'')}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>`;$('modal').classList.remove('hidden')}
async function savePlant(e,id){e.preventDefault();const data={name:$('name').value.trim(),species:$('species').value.trim(),variety:$('variety').value.trim(),status:$('status').value,purchase_source:$('source').value.trim(),cost:Number($('cost').value||0),purchase_date:$('date').value||null,location:$('location').value.trim(),sale_price:Number($('sale').value||0),notes:$('notes').value.trim()};const r=id?await db.from('plants').update(data).eq('id',id):await db.from('plants').insert({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data});if(r.error)alert(r.error.message);else{closeModal();await load()}}
async function moveSale(id){const p=plants.find(x=>x.id===id);if(!p)return;const value=prompt('Target sale price (£)',p.sale_price||'');if(value===null)return;const price=Number(value);if(!Number.isFinite(price)||price<0)return alert('Enter a valid sale price.');const r=await db.from('plants').update({status:'For Sale',sale_price:price,moved_to_sales_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else await load()}
function openSale(id=''){const candidates=plants.filter(p=>p.status==='For Sale'||p.status!=='Sold');if(!candidates.length)return alert('Add a plant first.');const selected=plants.find(p=>p.id===id)||candidates.find(p=>p.status==='For Sale')||candidates[0];$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Complete a sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="formgrid"><div class="field full"><label>Plant *</label><select id="salePlant">${candidates.map(p=>`<option value="${p.id}" ${p.id===selected.id?'selected':''}>${esc(p.name)} — ${esc(p.status)} — target ${money(p.sale_price)}</option>`).join('')}</select></div><div class="field"><label>Sale price (£) *</label><input id="salePrice" type="number" step="0.01" min="0" required value="${esc(selected.sale_price||'')}"></div><div class="field"><label>Plant cost (£)</label><input id="saleCost" type="number" step="0.01" min="0" value="${esc(selected.cost||0)}"></div><div class="field"><label>Sale date</label><input id="saleDate" type="date" value="${today()}"></div><div class="field"><label>Buyer</label><input id="buyer" placeholder="Name / username"></div><div class="field"><label>Channel</label><input id="channel" placeholder="Direct, eBay, Etsy, Facebook…"></div><div class="field full"><label>Notes</label><textarea id="saleNotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Record sale</button></div></form></div>`;$('modal').classList.remove('hidden')}
async function saveSale(e){e.preventDefault();const pid=$('salePlant').value,p=plants.find(x=>x.id===pid);if(!p)return;const sale={plant_id:pid,plant_name:p.name,sale_date:$('saleDate').value||today(),sale_price:Number($('salePrice').value||0),cost:Number($('saleCost').value||p.cost||0),buyer:$('buyer').value.trim(),channel:$('channel').value.trim(),notes:$('saleNotes').value.trim()};const r=await db.from('sales').insert(sale);if(r.error)return alert(r.error.message);const u=await db.from('plants').update({status:'Sold',sale_price:sale.sale_price,sale_date:sale.sale_date}).eq('id',pid);if(u.error)alert('Sale recorded, but plant status could not be updated: '+u.error.message);closeModal();await load()}
function openProp(parentId=''){const parent=plants.find(p=>p.id===parentId)||plants.find(p=>p.status!=='Sold');if(!parent)return alert('Add a plant first.');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Propagate / Cut</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProp(event)"><div class="formgrid"><div class="field full"><label>Parent plant *</label><select id="parent">${plants.filter(p=>p.status!=='Sold').map(p=>`<option value="${p.id}" ${p.id===parent.id?'selected':''}>${esc(p.name)} — ${esc(p.plant_code)}</option>`).join('')}</select></div><div class="field"><label>Propagation type</label><select id="propType"><option>Cutting</option><option>Node cutting</option><option>Top cutting</option><option>Division</option><option>Offset</option><option>Leaf</option><option>Seed</option></select></div><div class="field"><label>Date</label><input id="propDate" type="date" value="${today()}"></div><div class="field"><label>New plant name</label><input id="childName" value="${esc(parent.name+' cutting')}"></div><div class="field"><label>Starting sale price (£)</label><input id="childSale" type="number" step="0.01" min="0" value="0"></div><div class="field full"><label>Notes</label><textarea id="propNotes" placeholder="Node count, condition, rooting method…"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create cutting</button></div></form></div>`;$('modal').classList.remove('hidden')}
async function saveProp(e){e.preventDefault();const pid=$('parent').value,p=plants.find(x=>x.id===pid);if(!p)return;const child={plant_code:'PL-'+Date.now().toString(36).toUpperCase(),name:$('childName').value.trim()||p.name+' cutting',species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.plant_code,purchase_date:$('propDate').value||today(),location:p.location,sale_price:Number($('childSale').value||0),notes:'Propagated from '+p.name};const ins=await db.from('plants').insert({parent_plant_id:pid,...child}).select().single();if(ins.error)return alert(ins.error.message);const pr=await db.from('propagations').insert({plant_id:pid,child_plant_id:ins.data.id,propagation_type:$('propType').value,propagated_at:$('propDate').value||today(),notes:$('propNotes').value.trim()});if(pr.error){await db.from('plants').delete().eq('id',ins.data.id);return alert(pr.error.message)}const up=await db.from('plants').update({propagation_count:Number(p.propagation_count||0)+1}).eq('id',pid);if(up.error)alert('Cutting created, but parent count failed: '+up.error.message);closeModal();await load()}
async function deletePlant(id){if(!confirm('Delete this plant? Any linked sale will remain but lose its plant link.'))return;const r=await db.from('plants').delete().eq('id',id);if(r.error)alert(r.error.message);else await load()}
async function deleteSale(id){if(!confirm('Delete this sale record? The plant will not automatically return to inventory.'))return;const r=await db.from('sales').delete().eq('id',id);if(r.error)alert(r.error.message);else await load()}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});load();
</script></body></html>
