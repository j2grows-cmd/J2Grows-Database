<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows Plant Database</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06100b;--p:#0d1b13;--p2:#11251a;--l:#20392a;--t:#f4f8f4;--m:#8da494;--g:#7ee787;--r:#ff7b72;--a:#e3b341}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173b25,transparent 32%),var(--bg);color:var(--t);font:14px/1.45 system-ui,sans-serif}.layout{display:flex;min-height:100vh}.side{width:235px;border-right:1px solid var(--l);padding:22px 14px;background:#07110bd9}.brand{font-size:19px;font-weight:900;padding:6px 10px 28px}.logo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#c5ffc9,#3fb950);margin-right:9px;color:#08220e}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--m);padding:12px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:var(--p2);color:var(--t)}main{flex:1;max-width:1500px;width:100%;padding:28px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.ey{color:var(--g);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800}.title{font-size:30px;font-weight:900}.sub,.mini{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select,textarea{font:inherit;border:1px solid var(--l);background:#08150d;color:var(--t);padding:10px;border-radius:9px}.btn{font-weight:750;cursor:pointer}.primary{background:var(--g);color:#06200b;border-color:var(--g)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:linear-gradient(180deg,#11241aee,#0b1911ee);border:1px solid var(--l);border-radius:15px;padding:16px}.metric{font-size:26px;font-weight:900;margin-top:5px}.label{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:15px}.panel{padding:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panel h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--l);white-space:nowrap}.table th{font-size:10px;color:var(--m);text-transform:uppercase}.tag{padding:4px 8px;border-radius:999px;background:#193522;color:#a9efb3;font-size:11px}.sale{background:#3b2d13;color:#f3ca73}.sold{background:#321a18;color:#ffaaa4}.search{min-width:220px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--m);font-weight:700}.full{grid-column:1/-1}textarea{min-height:85px;resize:vertical}.empty{text-align:center;padding:45px;color:var(--m)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0b1911;border:1px solid var(--l);border-radius:18px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.close{border:0;background:transparent;color:var(--m);font-size:25px}.profit{color:var(--g);font-weight:800}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.side{display:none}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="logo">🌱</span>J2Grows</div><nav class="nav"><button class="active" onclick="setView('dashboard')">◈ &nbsp;Dashboard</button><button onclick="setView('plants')">🌿 &nbsp;My Plants</button><button onclick="setView('sales')">£ &nbsp;Sales</button><button onclick="setView('propagation')">✂️ &nbsp;Propagation</button></nav></aside><main id="app"></main></div><div id="modal" class="modal hidden"></div><script>const URL='https://izsjxfigndqkuarooequ.supabase.co',KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR',db=supabase.createClient(URL,KEY);let plants=[],sales=[],props=[],view='dashboard';const $=x=>document.getElementById(x),money=n=>'£'+Number(n||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let a=await db.from('plants').select('*').order('created_at',{ascending:false}),b=await db.from('sales').select('*').order('sale_date',{ascending:false}),c=await db.from('propagations').select('*').order('created_at',{ascending:false});if(a.error||b.error||c.error){alert((a.error||b.error||c.error).message);return}plants=a.data||[];sales=b.data||[];props=c.data||[];render()}function setView(v){view=v;render()}function top(t,s,x=''){return `<div class="top"><div><div class="ey">J2Grows Plant Database</div><div class="title">${t}</div><div class="sub">${s}</div></div><div class="actions">${x}</div></div>`}function status(p){return `<span class="tag ${p.status==='Sold'?'sold':p.status==='For Sale'?'sale':''}">${esc(p.status)}</span>`}function plantTable(list){if(!list.length)return `<div class="empty">No plants logged yet.<br><br><button class="btn primary" onclick="openPlant()">+ Log your first plant</button></div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Where from</th><th>Cost</th><th>Sale price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mini">${esc(p.species||'')}${p.variety?' · '+esc(p.variety):''}</div></td><td>${esc(p.purchase_source||p.source||'—')}</td><td>${money(p.cost)}</td><td>${p.sale_price?money(p.sale_price):'—'}</td><td>${status(p)}</td><td><div class="actions"><button class="btn" onclick="openPlant('${p.id}')">Edit</button>${p.status!=='Sold'?`<button class="btn" onclick="openProp('${p.id}')">✂ Cut</button>`:''}${p.status!=='Sold'&&p.status!=='For Sale'?`<button class="btn" onclick="moveSale('${p.id}')">£ Move to sales</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}function dashboard(){let held=plants.filter(p=>p.status!=='Sold').length,fs=plants.filter(p=>p.status==='For Sale').length,rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0);return top('Dashboard','Your collection, propagation and sales in one place.',`<button class="btn primary" onclick="openPlant()">+ Log plant</button>`)+`<div class="cards"><div class="card"><div class="label">Plants</div><div class="metric">${plants.length}</div><div class="sub">${held} held</div></div><div class="card"><div class="label">For sale</div><div class="metric">${fs}</div><div class="sub">in sales pipeline</div></div><div class="card"><div class="label">Propagations</div><div class="metric">${props.length}</div><div class="sub">cuttings logged</div></div><div class="card"><div class="label">Revenue</div><div class="metric">${money(rev)}</div><div class="sub">${sales.length} completed sales</div></div><div class="card"><div class="label">Profit</div><div class="metric profit">${money(rev-cost)}</div><div class="sub">revenue − cost</div></div></div><div class="grid"><section class="panel"><div class="panelhead"><h2>Plant collection</h2><button class="btn" onclick="setView('plants')">Manage</button></div>${plantTable(plants.slice(0,8))}</section><section class="panel"><div class="panelhead"><h2>Recent sales</h2><button class="btn" onclick="setView('sales')">All sales</button></div>${saleTable(sales.slice(0,7))}</section></div>`}function plantsView(){return top('My Plants','Log what you own, where it came from, what it cost and what you want to sell it for.',`<input id="search" class="search" placeholder="Search plants…" oninput="filterPlants()"><button class="btn primary" onclick="openPlant()">+ Log plant</button>`)+`<section class="panel" id="plantPanel">${plantTable(plants)}</section>`}function filterPlants(){let q=($('search').value||'').toLowerCase();$('plantPanel').innerHTML=plantTable(plants.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}function saleTable(list){if(!list.length)return '<div class="empty">No sales yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Buyer</th><th>Price</th><th>Profit</th></tr></thead><tbody>${list.map(s=>{let x=Number(s.sale_price)-Number(s.cost);return `<tr><td>${esc(s.sale_date)}</td><td>${esc(s.plant_name)}</td><td>${esc(s.buyer||'—')}</td><td>${money(s.sale_price)}</td><td class="${x>=0?'profit':''}">${money(x)}</td></tr>`}).join('')}</tbody></table></div>`}function salesView(){return top('Sales','Your sales pipeline and completed sales.',`<button class="btn primary" onclick="openSale()">+ Log sale</button>`)+`<section class="panel">${saleTable(sales)}</section>`}function propagationView(){return top('Propagation','Track every cutting and which plant it came from.',`<button class="btn primary" onclick="openProp()">+ Propagate / Cut</button>`)+`<section class="panel">${props.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Parent plant</th><th>Type</th><th>Child plant</th><th>Notes</th></tr></thead><tbody>${props.map(x=>{let p=plants.find(p=>p.id===x.plant_id),ch=plants.find(p=>p.id===x.child_plant_id);return `<tr><td>${esc(x.propagated_at)}</td><td>${esc(p?.name||'Unknown')}</td><td>${esc(x.propagation_type)}</td><td>${esc(ch?.name||'—')}</td><td>${esc(x.notes||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No propagations logged yet.</div>'}</section>`}function render(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['dashboard','plants','sales','propagation'][i]===view));$('app').innerHTML=view==='dashboard'?dashboard():view==='plants'?plantsView():view==='sales'?salesView():propagationView()}function openPlant(id=''){let p=plants.find(x=>x.id===id)||{name:'',species:'',variety:'',status:'Owned',cost:'',purchase_source:'',purchase_date:'',location:'',sale_price:'',notes:''};$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edit plant':'Log a plant'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="savePlant(event,'${id}')"><div class="formgrid"><div class="field"><label>Plant name *</label><input id="name" required value="${esc(p.name)}" placeholder="e.g. Monstera Thai Constellation"></div><div class="field"><label>Species</label><input id="species" value="${esc(p.species)}"></div><div class="field"><label>Variety / cultivar</label><input id="variety" value="${esc(p.variety)}"></div><div class="field"><label>Status</label><select id="status">${['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Where did you get it?</label><input id="source" value="${esc(p.purchase_source||p.source)}" placeholder="Shop, eBay, Facebook, collector…"></div><div class="field"><label>Cost (£)</label><input id="cost" type="number" step="0.01" value="${esc(p.cost)}"></div><div class="field"><label>Purchase date</label><input id="date" type="date" value="${esc(p.purchase_date)}"></div><div class="field"><label>Location</label><input id="location" value="${esc(p.location)}" placeholder="Greenhouse, shelf…"></div><div class="field"><label>Target sale price (£)</label><input id="sale" type="number" step="0.01" value="${esc(p.sale_price)}"></div><div class="field full"><label>Notes</label><textarea id="notes">${esc(p.notes)}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>`;$('modal').classList.remove('hidden')}async function savePlant(e,id){e.preventDefault();let data={name:$('name').value,species:$('species').value,variety:$('variety').value,status:$('status').value,purchase_source:$('source').value,cost:Number($('cost').value||0),purchase_date:$('date').value||null,location:$('location').value,sale_price:Number($('sale').value||0),notes:$('notes').value};let r=id?await db.from('plants').update(data).eq('id',id):await db.from('plants').insert({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data});if(r.error)alert(r.error.message);else{closeModal();await load()}}async function moveSale(id){let p=plants.find(x=>x.id===id),price=prompt(`Sale price for ${p.name}`,p.sale_price||'');if(price===null)return;let r=await db.from('plants').update({status:'For Sale',sale_price:Number(price),moved_to_sales_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}function openSale(){let available=plants.filter(p=>p.status!=='Sold');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Complete a sale</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="formgrid"><div class="field full"><label>Plant *</label><select id="salePlant" required>${available.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.sale_price)}</option>`).join('')}</select></div><div class="field"><label>Sale price (£) *</label><input id="saleAmount" required type="number" step="0.01"></div><div class="field"><label>Plant cost (£)</label><input id="saleCost" type="number" step="0.01"></div><div class="field"><label>Buyer</label><input id="buyer"></div><div class="field"><label>Platform / channel</label><input id="channel" placeholder="Direct, eBay, Facebook…"></div><div class="field full"><label>Notes</label><textarea id="saleNotes"></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Record sale</button></div></form></div>`;$('modal').classList.remove('hidden');$('salePlant').onchange=()=>{let p=plants.find(x=>x.id==$('salePlant').value);$('saleAmount').value=p?.sale_price||'';$('saleCost').value=p?.cost||0};$('salePlant').dispatchEvent(new Event('change'))}async function saveSale(e){e.preventDefault();let p=plants.find(x=>x.id==$('salePlant').value),r=await db.from('sales').insert({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:Number($('saleAmount').value),cost:Number($('saleCost').value||0),buyer:$('buyer').value,channel:$('channel').value,notes:$('saleNotes').value});if(r.error)alert(r.error.message);else{let u=await db.from('plants').update({status:'Sold',sale_date:today(),sale_price:Number($('saleAmount').value)}).eq('id',p.id);if(u.error)alert(u.error.message);closeModal();load()}}function openProp(id=''){let opts=plants.filter(x=>x.status!=='Sold').map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>✂️ Propagate / Cut</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProp(event)"><div class="formgrid"><div class="field full"><label>Parent plant *</label><select id="parent" required>${opts}</select></div><div class="field"><label>Type</label><select id="ptype"><option>Cutting</option><option>Node cutting</option><option>Top cutting</option><option>Division</option><option>Leaf</option><option>Other</option></select></div><div class="field"><label>Date</label><input id="pdate" type="date" value="${today()}"></div><div class="field"><label>Create child plant?</label><select id="create"><option value="yes">Yes — add to inventory</option><option value="no">No — just log it</option></select></div><div class="field full"><label>Notes</label><textarea id="pnotes" placeholder="Node count, rooting method, etc."></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Log propagation</button></div></form></div>`;$('modal').classList.remove('hidden')}async function saveProp(e){e.preventDefault();let parent=plants.find(x=>x.id==$('parent').value),child=null;if($('create').value==='yes'){let r=await db.from('plants').insert({plant_code:'PROP-'+Date.now().toString(36).toUpperCase(),name:parent.name+' cutting',species:parent.species,variety:parent.variety,status:'Propagating',cost:0,parent_plant_id:parent.id,purchase_source:'Propagation'}).select().single();if(r.error){alert(r.error.message);return}child=r.data}let r=await db.from('propagations').insert({plant_id:parent.id,child_plant_id:child?.id||null,propagation_type:$('ptype').value,propagated_at:$('pdate').value,notes:$('pnotes').value});if(r.error)alert(r.error.message);else{closeModal();load()}}function closeModal(){$('modal').classList.add('hidden')}load();</script></body></html>
