<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows Cloud Database</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07110c;color:#f2f7f2;font:15px system-ui}main{max-width:1200px;margin:auto;padding:28px}.card{background:#102018;border:1px solid #284633;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:800}.muted{color:#8fa596}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #34533f;background:#08150d;color:#fff}button{cursor:pointer}.primary{background:#7ee787;color:#08220e;border-color:#7ee787}.row{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #284633;text-align:left}#auth{max-width:430px;margin:10vh auto}.hide{display:none}.danger{color:#ff8f87}</style></head><body><main><div id="auth" class="card"><h1>🌱 J2Grows</h1><p class="muted">Cloud plant & sales database</p><input id="email" type="email" placeholder="Email" style="width:100%;box-sizing:border-box;margin:5px 0"><input id="password" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;margin:5px 0"><div class="row"><button class="primary" onclick="login()">Sign in</button><button onclick="signup()">Create account</button></div><p id="msg" class="muted"></p></div><div id="app" class="hide"><div class="row" style="justify-content:space-between"><div><h1>🌱 J2Grows Database</h1><p id="user" class="muted"></p></div><button onclick="logout()">Sign out</button></div><div class="grid"><div class="card"><span class="muted">Plants</span><div id="plantsCount" class="metric">0</div></div><div class="card"><span class="muted">Sales</span><div id="salesCount" class="metric">0</div></div><div class="card"><span class="muted">Revenue</span><div id="revenue" class="metric">£0.00</div></div><div class="card"><span class="muted">Profit</span><div id="profit" class="metric">£0.00</div></div></div><div class="card"><h2>Plants</h2><form onsubmit="addPlant(event)" class="row"><input id="pn" required placeholder="Plant name"><input id="ps" placeholder="Species"><input id="pc" type="number" step="0.01" placeholder="Cost"><select id="pst"><option>Owned</option><option>Growing</option><option>For Sale</option><option>Propagating</option><option>Sold</option><option>Lost</option></select><button class="primary">+ Add plant</button></form><table><thead><tr><th>Name</th><th>Species</th><th>Status</th><th>Cost</th></tr></thead><tbody id="plantRows"></tbody></table></div><div class="card"><h2>Sales</h2><form onsubmit="addSale(event)" class="row"><select id="spn"></select><input id="salePrice" required type="number" step="0.01" placeholder="Sale price"><input id="saleCost" type="number" step="0.01" placeholder="Cost"><input id="buyer" placeholder="Buyer"><button class="primary">+ Log sale</button></form><table><thead><tr><th>Date</th><th>Plant</th><th>Buyer</th><th>Sale</th><th>Profit</th></tr></thead><tbody id="saleRows"></tbody></table></div></div></main><script>const URL='https://izsjxfigndqkuarooequ.supabase.co',KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR',db=supabase.createClient(URL,KEY);let plants=[],sales=[];const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toFixed(2);async function login(){let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('msg').textContent=error?.message||''}async function signup(){let {error}=await db.auth.signUp({email:$('email').value,password:$('password').value});$('msg').textContent=error?.message||'Account created. Check your email if confirmation is required.'}async function logout(){await db.auth.signOut()}async function boot(){let {data:{session}}=await db.auth.getSession();show(session);db.auth.onAuthStateChange((_e,s)=>show(s))}async function show(s){$('auth').classList.toggle('hide',!!s);$('app').classList.toggle('hide',!s);if(s){$('user').textContent=s.user.email;await load()}}async function load(){let {data:p,error:pe}=await db.from('plants').select('*').order('created_at',{ascending:false});let {data:s,error:se}=await db.from('sales').select('*').order('sale_date',{ascending:false});if(pe||se){alert((pe||se).message);return}plants=p||[];sales=s||[];render()}function render(){$('plantsCount').textContent=plants.length;$('salesCount').textContent=sales.length;let rev=sales.reduce((a,x)=>a+Number(x.sale_price),0),cost=sales.reduce((a,x)=>a+Number(x.cost),0);$('revenue').textContent=money(rev);$('profit').textContent=money(rev-cost);$('plantRows').innerHTML=plants.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.species||'')}</td><td>${esc(p.status)}</td><td>${money(p.cost)}</td></tr>`).join('');$('saleRows').innerHTML=sales.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(s.plant_name)}</td><td>${esc(s.buyer||'')}</td><td>${money(s.sale_price)}</td><td>${money(Number(s.sale_price)-Number(s.cost))}</td></tr>`).join('');$('spn').innerHTML=plants.filter(p=>p.status!=='Sold').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}function esc(x){return String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function addPlant(e){e.preventDefault();let {data:{user}}=await db.auth.getUser();let {error}=await db.from('plants').insert({user_id:user.id,plant_code:'PL-'+Date.now().toString(36).toUpperCase(),name:$('pn').value,species:$('ps').value,cost:Number($('pc').value||0),status:$('pst').value});if(error)alert(error.message);else{e.target.reset();await load()}}async function addSale(e){e.preventDefault();let {data:{user}}=await db.auth.getUser(),pid=$('spn').value,p=plants.find(x=>x.id===pid);let {error}=await db.from('sales').insert({user_id:user.id,plant_id:pid,plant_name:p?.name||'Unknown',sale_price:Number($('salePrice').value),cost:Number($('saleCost').value||p?.cost||0),buyer:$('buyer').value});if(error)alert(error.message);else{if(p)await db.from('plants').update({status:'Sold'}).eq('id',pid);e.target.reset();await load()}}boot();</script></body></html>
