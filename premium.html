<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows — Plant Manager</title><style>:root{--bg:#07100c;--surface:#0d1812;--surface2:#111f17;--line:#203328;--text:#f4f7f4;--muted:#8ea194;--green:#8be28f;--green2:#4bc66b;--gold:#e9c878;--red:#ff8279;--shadow:0 24px 70px #0007}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1b4529 0,transparent 60%),linear-gradient(135deg,#07100c,#09130e);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:flex}.sidebar{width:245px;background:#08110cd9;border-right:1px solid var(--line);padding:22px 15px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 30px;font-size:20px;font-weight:850}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#c8ffcc,#43c765);display:grid;place-items:center;color:#06200c;box-shadow:0 10px 30px #43c76533}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;border-radius:11px;text-align:left;font-weight:700}.nav button:hover,.nav button.active{background:#12231a;border-color:#1f3828;color:var(--text)}.content{margin-left:245px;width:calc(100% - 245px);padding:34px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.kicker{font-size:11px;color:var(--green);font-weight:850;letter-spacing:.14em;text-transform:uppercase}.title{font-size:34px;font-weight:900;letter-spacing:-.03em;margin:4px 0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0d1a13;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:750;transition:.15s}.btn:hover{transform:translateY(-1px);border-color:#365b42;background:#12231a}.primary{background:var(--green);border-color:var(--green);color:#06200c}.primary:hover{background:#a0eea4}.danger{color:#ffaaa4}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.card,.panel{background:linear-gradient(180deg,#102018eF,#0c1711eF);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em}.metric{font-size:29px;font-weight:900;margin:6px 0}.metric.green{color:var(--green)}.metric.gold{color:var(--gold)}.panel{padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{margin:0;font-size:17px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#153421;color:#a9efb2;font-size:11px;font-weight:800}.search{width:min(300px,100%);background:#09140e;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;outline:none}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modal.hidden{display:none}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0b1710;border:1px solid #294532;border-radius:19px;padding:22px;box-shadow:0 35px 100px #000b}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:22px}.close{border:0;background:transparent;color:var(--muted);font-size:26px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;background:#07110c;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2)}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:15px;margin-bottom:18px}.heroCard{padding:23px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(135deg,#132a1b,#0d1912)}.heroCard h2{font-size:25px;margin:5px 0 8px}.mini{display:grid;gap:10px}.mini .item{padding:15px;border:1px solid var(--line);border-radius:13px;background:#0c1711}.profit{color:var(--green);font-weight:850}.loss{color:var(--red);font-weight:850}@media(max-width:950px){.sidebar{width:76px}.brand span,.nav span{display:none}.brand{justify-content:center}.nav button{text-align:center}.content{margin-left:76px;width:calc(100% - 76px)}.cards{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:600px){.sidebar{display:none}.content{margin:0;width:100%;padding:18px}.cards,.form{grid-template-columns:1fr}.field.full{grid-column:auto}.top{flex-direction:column}.title{font-size:28px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">🌱</div><span>J2Grows</span></div><nav class="nav"><button class="active" onclick="page('dashboard',this)">◈ <span>Dashboard</span></button><button onclick="page('plants',this)">🌿 <span>My Plants</span></button><button onclick="page('sales',this)">£ <span>Sales</span></button><button onclick="page('propagation',this)">✂ <span>Propagation</span></button></nav></aside><main class="content" id="content"></main></div><div id="modal" class="modal hidden"></div><script>const API='https://izsjxfigndqkuarooequ.supabase.co/rest/v1';const KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';let plants=[],sales=[],propagations=[],current='dashboard';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'£'+Number(n||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10);async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw Error(data?.message||data?.hint||text||r.statusText);return data}async function load(){try{[plants,sales,propagations]=await Promise.all([api('/plants?select=*&order=created_at.desc'),api('/sales?select=*&order=sale_date.desc'),api('/propagations?select=*&order=created_at.desc')]);render()}catch(e){$('content').innerHTML='<div class="panel"><h2>Database connection error</h2><p class="sub">'+esc(e.message)+'</p><button class="btn primary" onclick="load()">Retry</button></div>'}}function page(p,b){current=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function header(k,t,s,actions=''){return '<div class="top"><div><div class="kicker">J2Grows</div><div class="title">'+t+'</div><div class="sub">'+s+'</div></div><div class="actions">'+actions+'</div></div>'}function render(){if(current==='dashboard')dashboard();if(current==='plants')plantsPage();if(current==='sales')salesPage();if(current==='propagation')propPage()}function dashboard(){const rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0),held=plants.filter(p=>!['Sold'].includes(p.status)).length,fs=plants.filter(p=>p.status==='For Sale').length; $('content').innerHTML=header('Overview','Your collection, propagation and sales in one place.','<button class="btn primary" onclick="openPlant()">+ Add plant</button>')+'<div class="hero"><div class="heroCard"><div class="kicker">Collection</div><h2>'+held+' plants currently held</h2><div class="sub">'+fs+' plants are currently listed for sale · '+propagations.length+' propagation records</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="page(\'plants\')">Manage plants</button><button class="btn" onclick="page(\'sales\')">View sales</button></div></div><div class="mini"><div class="item"><div class="label">Revenue</div><div class="metric gold">'+money(rev)+'</div></div><div class="item"><div class="label">Realised profit</div><div class="metric green">'+money(rev-cost)+'</div></div></div></div><div class="cards"><div class="card"><div class="label">All plants</div><div class="metric">'+plants.length+'</div></div><div class="card"><div class="label">For sale</div><div class="metric">'+fs+'</div></div><div class="card"><div class="label">Sales</div><div class="metric">'+sales.length+'</div></div><div class="card"><div class="label">Propagations</div><div class="metric">'+propagations.length+'</div></div></div><section class="panel"><div class="panelhead"><h2>Recent plants</h2><button class="btn" onclick="page(\'plants\')">View all</button></div>'+plantTable(plants.slice(0,6))+'</section>'}function plantTable(rows){if(!rows.length)return '<div class="empty">No plants yet.<br><br><button class="btn primary" onclick="openPlant()">Add your first plant</button></div>';return '<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Sale target</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="sub">'+esc(p.species||'')+(p.variety?' · '+esc(p.variety):'')+'</span></td><td>'+esc(p.purchase_source||p.source||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.sale_price)+'</td><td><span class="tag">'+esc(p.status)+'</span></td><td><div class="actions"><button class="btn" onclick="openPlant(\''+p.id+'\')">Edit</button><button class="btn" onclick="cut(\''+p.id+'\')">✂ Cut</button>'+((p.status!=='For Sale'&&p.status!=='Sold')?'<button class="btn" onclick="moveSale(\''+p.id+'\')">£ Sales</button>':'')+(p.status==='For Sale'?'<button class="btn primary" onclick="sell(\''+p.id+'\')">Sell</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>'}function plantsPage(){ $('content').innerHTML=header('Inventory','Every plant, purchase and target sale price.','<input class="search" id="search" placeholder="Search plants…" oninput="filterPlants()"><button class="btn primary" onclick="openPlant()">+ Add plant</button>')+'<section class="panel" id="plantPanel">'+plantTable(plants)+'</section>'}function filterPlants(){const q=($('search').value||'').toLowerCase();$('plantPanel').innerHTML=plantTable(plants.filter(p=>JSON.stringify(p).toLowerCase().includes(q)))}function salesPage(){const rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),profit=sales.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0),0);$('content').innerHTML=header('Sales','Completed plant sales and realised profit.','<div class="sub">'+sales.length+' sales · '+money(rev)+' revenue · <b class="profit">'+money(profit)+' profit</b></div>')+'<section class="panel">'+(sales.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Price</th><th>Cost</th><th>Profit</th><th>Buyer</th><th>Channel</th></tr></thead><tbody>'+sales.map(s=>'<tr><td>'+esc(s.sale_date)+'</td><td><b>'+esc(s.plant_name)+'</b></td><td>'+money(s.sale_price)+'</td><td>'+money(s.cost)+'</td><td class="'+(Number(s.sale_price)-Number(s.cost)>=0?'profit':'loss')+'">'+money(Number(s.sale_price)-Number(s.cost))+'</td><td>'+esc(s.buyer||'—')+'</td><td>'+esc(s.channel||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No completed sales yet.</div>')+'</section>'}function propPage(){$('content').innerHTML=header('Propagation','Track the plants you create from your collection.','<button class="btn primary" onclick="page(\'plants\')">Go to plants</button>')+'<section class="panel">'+(propagations.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Parent</th><th>Notes</th></tr></thead><tbody>'+propagations.map(x=>'<tr><td>'+esc(x.propagated_at)+'</td><td><span class="tag">'+esc(x.propagation_type)+'</span></td><td>'+esc(x.plant_id||'—')+'</td><td>'+esc(x.notes||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No propagation records yet.<br>Use ✂ Cut from a plant to create one.</div>')+'</section>'}function close(){ $('modal').classList.add('hidden');$('modal').innerHTML=''}function openPlant(id=''){const p=plants.find(x=>x.id===id)||{};$('modal').innerHTML='<div class="box"><div class="modalhead"><h2>'+(id?'Edit plant':'Add plant')+'</h2><button class="close" onclick="close()">×</button></div><form onsubmit="savePlant(event,\''+id+'\')"><div class="form"><div class="field"><label>Plant name *</label><input id="n" required value="'+esc(p.name||'')+'" placeholder="e.g. Alocasia Frydek Variegated"></div><div class="field"><label>Species</label><input id="sp" value="'+esc(p.species||'')+'"></div><div class="field"><label>Variety / cultivar</label><input id="va" value="'+esc(p.variety||'')+'"></div><div class="field"><label>Status</label><select id="st">'+['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>'<option '+(p.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Where did you get it?</label><input id="src" value="'+esc(p.purchase_source||p.source||'')+'" placeholder="e.g. eBay, local seller, cutting"></div><div class="field"><label>Cost (£)</label><input id="co" type="number" step="0.01" min="0" value="'+Number(p.cost||0)+'"></div><div class="field"><label>Purchase date</label><input id="dt" type="date" value="'+esc(p.purchase_date||'')+'"></div><div class="field"><label>Location</label><input id="loc" value="'+esc(p.location||'')+'" placeholder="Shelf, greenhouse…"></div><div class="field"><label>Target sale price (£)</label><input id="spc" type="number" step="0.01" min="0" value="'+Number(p.sale_price||0)+'"></div><div class="field full"><label>Notes</label><textarea id="no">'+esc(p.notes||'')+'</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>';$('modal').classList.remove('hidden')}async function savePlant(e,id){e.preventDefault();try{const data={name:$('n').value.trim(),species:$('sp').value.trim(),variety:$('va').value.trim(),status:$('st').value,purchase_source:$('src').value.trim(),cost:Number($('co').value||0),purchase_date:$('dt').value||null,location:$('loc').value.trim(),sale_price:Number($('spc').value||0),notes:$('no').value.trim()};if(id)await api('/plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});else await api('/plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data})});close();await load()}catch(e){alert('Could not save plant: '+e.message)}}async function moveSale(id){const p=plants.find(x=>x.id===id);const v=prompt('Target sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:price,moved_to_sales_at:new Date().toISOString()})});await load()}catch(e){alert(e.message)}}async function sell(id){const p=plants.find(x=>x.id===id);const v=prompt('Actual sale price (£)',p?.sale_price||'');if(v===null)return;const price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');try{await api('/sales',{method:'POST',body:JSON.stringify({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:price,cost:Number(p.cost||0)})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'Sold',sale_price:price,sale_date:today()})});await load()}catch(e){alert(e.message)}}async function cut(id){const p=plants.find(x=>x.id===id);const name=prompt('Name for the new plant/cutting',p.name+' cutting');if(name===null)return;const type=prompt('Propagation type (Cutting, Node, Top cutting, Division, Offset, Seed)','Cutting');if(type===null)return;try{const child=await api('/plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),parent_plant_id:p.id,name,species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.name,purchase_date:today(),location:p.location,notes:'Created by propagation from '+p.name})});await api('/propagations',{method:'POST',body:JSON.stringify({plant_id:p.id,child_plant_id:child[0]?.id,propagation_type:type,propagated_at:today(),notes:'New plant created from '+p.name})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({propagation_count:Number(p.propagation_count||0)+1})});await load()}catch(e){alert(e.message)}}load();</script></body></html>
