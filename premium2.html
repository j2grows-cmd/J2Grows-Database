<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J2Grows — Command Centre</title><style>
:root{--bg:#06100a;--surface:rgba(14,28,19,.82);--surface2:#10251a;--line:#213b2b;--text:#f4f8f4;--muted:#8fa496;--green:#9af0a1;--green2:#48ce70;--gold:#e8cf82;--red:#ff8178;--blue:#8dc9ff;--shadow:0 25px 80px #0008}*{box-sizing:border-box}body{margin:0;color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(700px 500px at 85% -10%,#1d5931 0,transparent 65%),radial-gradient(500px 400px at 10% 20%,#0d2c1b 0,transparent 60%),var(--bg)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:flex}.side{position:fixed;z-index:5;inset:0 auto 0 0;width:255px;padding:22px 16px;background:rgba(5,14,9,.78);backdrop-filter:blur(22px);border-right:1px solid #24402e}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 30px;font-size:21px;font-weight:900;letter-spacing:-.03em}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#d1ffd4,#40c866);color:#06200c;box-shadow:0 12px 35px #3ac96755}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:13px 14px;border-radius:12px;text-align:left;font-weight:750}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#153323,#102419);border-color:#244a31;color:var(--text)}.main{margin-left:255px;width:calc(100% - 255px);padding:34px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:900}.title{font-size:38px;font-weight:950;letter-spacing:-.045em;margin:5px 0}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0c1b12;color:var(--text);padding:10px 14px;border-radius:11px;font-weight:800;transition:.18s;box-shadow:0 8px 24px #0002}.btn:hover{transform:translateY(-2px);border-color:#426b4e;background:#14291c}.primary{background:var(--green);color:#06200c;border-color:var(--green)}.primary:hover{background:#b0f7b5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card,.panel{border:1px solid #24402e;background:linear-gradient(145deg,rgba(17,38,25,.92),rgba(9,21,14,.9));box-shadow:var(--shadow);border-radius:18px}.card{padding:20px}.label{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.metric{font-size:30px;font-weight:950;margin:6px 0}.green{color:var(--green)}.gold{color:var(--gold)}.hero{display:grid;grid-template-columns:1.5fr .5fr;gap:14px;margin-bottom:16px}.heroCard{min-height:210px;padding:27px;border-radius:20px;border:1px solid #2c5238;background:linear-gradient(135deg,#163a24,#0b1c12 70%);position:relative;overflow:hidden}.heroCard:after{content:'🌿';position:absolute;right:25px;bottom:-35px;font-size:150px;opacity:.07;transform:rotate(-15deg)}.heroCard h2{font-size:28px;letter-spacing:-.03em;margin:8px 0}.sideMetrics{display:grid;gap:14px}.mini{padding:19px;border-radius:17px;border:1px solid var(--line);background:var(--surface)}.panel{padding:20px;margin-bottom:16px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{margin:0;font-size:18px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #1e3527;text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#153c25;color:#aaf1b2;font-size:11px;font-weight:850}.tag.sale{background:#3b3218;color:#f2d98a}.tag.sold{background:#19303e;color:#9dd1ff}.tag.prop{background:#2c1f3e;color:#d2b1ff}.search{min-width:240px;background:#08150d;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:11px;outline:none}.empty{text-align:center;color:var(--muted);padding:55px 15px}.modal{position:fixed;z-index:20;inset:0;background:#000c;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.hidden{display:none}.box{width:min(760px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:21px;border:1px solid #345b40;background:#0b1910;box-shadow:0 40px 120px #000d}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalHead h2{margin:0;font-size:24px}.close{border:0;background:transparent;color:var(--muted);font-size:27px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.1em}.field input,.field select,.field textarea{background:#07120b;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2)}textarea{min-height:100px;resize:vertical}.statline{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}.statline div{padding:9px 12px;border-radius:10px;background:#0b1c12;border:1px solid #1d3626}.notice{padding:13px 15px;border:1px solid #3b5b40;border-radius:12px;background:#102718;color:#bfe9c5;margin-bottom:15px}.danger{color:var(--red)}@media(max-width:1000px){.side{width:76px}.brand span,.nav span{display:none}.brand{justify-content:center}.nav button{text-align:center}.main{margin-left:76px;width:calc(100% - 76px)}.cards{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0;width:100%;padding:18px}.cards,.form{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column}.title{font-size:30px}.search{min-width:0;width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">🌱</div><span>J2Grows</span></div><nav class="nav"><button class="active" onclick="go('dashboard',this)">◈ <span>Command Centre</span></button><button onclick="go('plants',this)">🌿 <span>Collection</span></button><button onclick="go('sales',this)">£ <span>Sales</span></button><button onclick="go('prop',this)">✂ <span>Propagation</span></button><button onclick="go('expenses',this)">◌ <span>Expenses</span></button></nav></aside><main class="main" id="main"></main></div><div id="modal" class="modal hidden"></div><script>
const API='https://izsjxfigndqkuarooequ.supabase.co/rest/v1',KEY='sb_publishable_l7YUVUI649sClf3h2_KH-Q_EHPO-ffR';let plants=[],sales=[],props=[],expenses=[],view='dashboard';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'£'+Number(x||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10);async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});let t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.hint||t||r.statusText);return d}async function load(){try{[plants,sales,props,expenses]=await Promise.all([api('/plants?select=*&order=created_at.desc'),api('/sales?select=*&order=sale_date.desc'),api('/propagations?select=*&order=created_at.desc'),api('/expenses?select=*&order=expense_date.desc')]);render()}catch(e){main.innerHTML='<div class="panel"><h2>Connection error</h2><p class="sub">'+esc(e.message)+'</p><button class="btn primary" onclick="load()">Retry</button></div>'}}function go(v,b){view=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function header(title,sub,actions=''){return '<div class="top"><div><div class="eyebrow">J2Grows · Operating System</div><div class="title">'+title+'</div><div class="sub">'+sub+'</div></div><div class="actions">'+actions+'</div></div>'}function render(){if(view==='dashboard')dashboard();if(view==='plants')plantsPage();if(view==='sales')salesPage();if(view==='prop')propPage();if(view==='expenses')expensePage()}function dashboard(){let rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),saleCost=sales.reduce((a,s)=>a+Number(s.cost||0),0),exp=expenses.reduce((a,e)=>a+Number(e.amount||0),0),held=plants.filter(p=>p.status!=='Sold').length,fs=plants.filter(p=>p.status==='For Sale').length,inventory=plants.filter(p=>p.status!=='Sold').reduce((a,p)=>a+Number(p.sale_price||0),0);main.innerHTML=header('Command Centre','A premium overview of your collection and J2Grows trading activity.','<button class="btn primary" onclick="openPlant()">＋ Add plant</button>')+'<div class="hero"><div class="heroCard"><div class="eyebrow">Collection health</div><h2>'+held+' plants under management</h2><p class="sub">'+fs+' currently for sale · '+props.length+' propagation records · '+plants.filter(p=>p.status==='Propagating').length+' propagating</p><div class="statline"><div>Inventory target <b>'+money(inventory)+'</b></div><div>Sales <b>'+sales.length+'</b></div><div>Expenses <b>'+money(exp)+'</b></div></div><div class="actions" style="margin-top:22px"><button class="btn primary" onclick="go(\'plants\')">Open collection</button><button class="btn" onclick="go(\'sales\')">Review sales</button></div></div><div class="sideMetrics"><div class="mini"><div class="label">Gross revenue</div><div class="metric gold">'+money(rev)+'</div></div><div class="mini"><div class="label">Net profit</div><div class="metric green">'+money(rev-saleCost-exp)+'</div></div></div></div><div class="cards"><div class="card"><div class="label">All plants</div><div class="metric">'+plants.length+'</div><div class="sub">'+held+' held</div></div><div class="card"><div class="label">For sale</div><div class="metric gold">'+fs+'</div><div class="sub">ready to sell</div></div><div class="card"><div class="label">Propagations</div><div class="metric">'+props.length+'</div><div class="sub">tracked events</div></div><div class="card"><div class="label">Realised profit</div><div class="metric green">'+money(rev-saleCost)+'</div><div class="sub">before overheads</div></div></div><section class="panel"><div class="panelHead"><h2>Latest collection activity</h2><button class="btn" onclick="go(\'plants\')">View collection</button></div>'+plantTable(plants.slice(0,7))+'</section>'}function badge(s){let c=s==='Sold'?'sold':s==='For Sale'?'sale':s==='Propagating'?'prop':'';return '<span class="tag '+c+'">'+esc(s)+'</span>'}function plantTable(rows){if(!rows.length)return '<div class="empty">Your collection is empty.<br><br><button class="btn primary" onclick="openPlant()">Add your first plant</button></div>';return '<div class="tablewrap"><table class="table"><thead><tr><th>Plant</th><th>Source</th><th>Cost</th><th>Target</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="sub">'+esc(p.species||'')+(p.variety?' · '+esc(p.variety):'')+'</span></td><td>'+esc(p.purchase_source||p.source||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.sale_price)+'</td><td>'+badge(p.status)+'</td><td><div class="actions"><button class="btn" onclick="openPlant(\''+p.id+'\')">Edit</button><button class="btn" onclick="cut(\''+p.id+'\')">✂</button>'+((p.status!=='For Sale'&&p.status!=='Sold')?'<button class="btn" onclick="moveSale(\''+p.id+'\')">£ List</button>':'')+(p.status==='For Sale'?'<button class="btn primary" onclick="sell(\''+p.id+'\')">Sell</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>'}function plantsPage(){main.innerHTML=header('Collection','Your complete living inventory, acquisition history and sale targets.','<input class="search" id="search" placeholder="Search by plant, species or source…" oninput="filterPlants()"><button class="btn primary" onclick="openPlant()">＋ Add plant</button>')+'<section class="panel" id="plantPanel">'+plantTable(plants)+'</section>'}function filterPlants(){let q=($('search').value||'').toLowerCase();$('plantPanel').innerHTML=plantTable(plants.filter(p=>JSON.stringify(p).toLowerCase().includes(q)))}function salesPage(){let rev=sales.reduce((a,s)=>a+Number(s.sale_price||0),0),profit=sales.reduce((a,s)=>a+Number(s.sale_price||0)-Number(s.cost||0),0);main.innerHTML=header('Sales','Every completed transaction, with realised margin.','<div class="sub"><b>'+sales.length+'</b> sales · <b class="gold">'+money(rev)+'</b> revenue · <b class="green">'+money(profit)+'</b> profit</div>')+'<section class="panel">'+(sales.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Plant</th><th>Sale</th><th>Cost</th><th>Profit</th><th>Buyer</th><th>Channel</th></tr></thead><tbody>'+sales.map(s=>'<tr><td>'+esc(s.sale_date)+'</td><td><b>'+esc(s.plant_name)+'</b></td><td>'+money(s.sale_price)+'</td><td>'+money(s.cost)+'</td><td class="'+(Number(s.sale_price)>=Number(s.cost)?'green':'danger')+'">'+money(Number(s.sale_price)-Number(s.cost))+'</td><td>'+esc(s.buyer||'—')+'</td><td>'+esc(s.channel||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No sales yet.</div>')+'</section>'}function propPage(){main.innerHTML=header('Propagation','Turn healthy plants into future inventory and track their lineage.','<button class="btn primary" onclick="go(\'plants\')">Open collection</button>')+'<section class="panel">'+(props.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Parent</th><th>Notes</th></tr></thead><tbody>'+props.map(x=>'<tr><td>'+esc(x.propagated_at||x.created_at?.slice(0,10))+'</td><td>'+badge(x.propagation_type)+'</td><td>'+esc(x.plant_id||'—')+'</td><td>'+esc(x.notes||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No propagation events yet.<br>Use ✂ on any plant to start one.</div>')+'</section>'}function expensePage(){let total=expenses.reduce((a,e)=>a+Number(e.amount||0),0);main.innerHTML=header('Expenses','Track the costs that turn sales into real business profit.','<button class="btn primary" onclick="openExpense()">＋ Add expense</button>')+'<section class="panel"><div class="panelHead"><h2>Total recorded</h2><div class="metric gold">'+money(total)+'</div></div>'+(expenses.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>'+expenses.map(e=>'<tr><td>'+esc(e.expense_date)+'</td><td>'+badge(e.category||'Other')+'</td><td>'+esc(e.description||'—')+'</td><td>'+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No expenses recorded yet.</div>')+'</section>'}function close(){modal.classList.add('hidden');modal.innerHTML=''}function openPlant(id=''){let p=plants.find(x=>x.id===id)||{};modal.innerHTML='<div class="box"><div class="modalHead"><h2>'+(id?'Edit plant':'Add plant')+'</h2><button class="close" onclick="close()">×</button></div><div class="notice">Build a complete record now — you can update status, value and notes as the plant moves through its lifecycle.</div><form onsubmit="savePlant(event,\''+id+'\')"><div class="form"><div class="field"><label>Plant name *</label><input id="pn" required value="'+esc(p.name||'')+'" placeholder="e.g. Thai Constellation #001"></div><div class="field"><label>Species</label><input id="ps" value="'+esc(p.species||'')+'"></div><div class="field"><label>Variety / cultivar</label><input id="pv" value="'+esc(p.variety||'')+'"></div><div class="field"><label>Status</label><select id="pst">'+['Owned','Growing','For Sale','Propagating','Sold','Lost'].map(x=>'<option '+(p.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Where did you get it?</label><input id="src" value="'+esc(p.purchase_source||p.source||'')+'"></div><div class="field"><label>Purchase cost (£)</label><input id="pc" type="number" step="0.01" value="'+Number(p.cost||0)+'"></div><div class="field"><label>Purchase date</label><input id="pd" type="date" value="'+esc(p.purchase_date||'')+'"></div><div class="field"><label>Location</label><input id="loc" value="'+esc(p.location||'')+'"></div><div class="field"><label>Target sale price (£)</label><input id="sp" type="number" step="0.01" value="'+Number(p.sale_price||0)+'"></div><div class="field full"><label>Photo URL</label><input id="photo" value="'+esc(p.photo_url||'')+'" placeholder="https://…"></div><div class="field full"><label>Notes</label><textarea id="notes">'+esc(p.notes||'')+'</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save plant</button></div></form></div>';modal.classList.remove('hidden')}async function savePlant(e,id){e.preventDefault();try{let data={name:pn.value.trim(),species:ps.value.trim(),variety:pv.value.trim(),status:pst.value,purchase_source:src.value.trim(),cost:Number(pc.value||0),purchase_date:pd.value||null,location:loc.value.trim(),sale_price:Number(sp.value||0),photo_url:photo.value.trim(),notes:notes.value.trim()};let r=id?await api('/plants?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)}):await api('/plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),...data})});close();await load()}catch(e){alert('Could not save plant: '+e.message)}}async function moveSale(id){let p=plants.find(x=>x.id===id);let v=prompt('Target sale price (£)',p?.sale_price||'');if(v===null)return;let price=Number(v);if(!Number.isFinite(price)||price<0)return alert('Enter a valid price');try{await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'For Sale',sale_price:price,moved_to_sales_at:new Date().toISOString()})});load()}catch(e){alert(e.message)}}async function sell(id){let p=plants.find(x=>x.id===id);let price=Number(prompt('Actual sale price (£)',p?.sale_price||'')||0);if(!price)return;try{await api('/sales',{method:'POST',body:JSON.stringify({plant_id:p.id,plant_name:p.name,sale_date:today(),sale_price:price,cost:Number(p.cost||0)})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'Sold',sale_price:price,sale_date:today()})});load()}catch(e){alert(e.message)}}async function cut(id){let p=plants.find(x=>x.id===id);let type=prompt('Propagation type: Node cutting / Top cutting / Division / Offset / Seed', 'Node cutting');if(type===null)return;let name=prompt('Name for new plant',p.name+' cutting');if(name===null)return;try{let child=await api('/plants',{method:'POST',body:JSON.stringify({plant_code:'PL-'+Date.now().toString(36).toUpperCase(),parent_plant_id:p.id,name,species:p.species,variety:p.variety,status:'Propagating',cost:0,purchase_source:'Propagation from '+p.plant_code,purchase_date:today(),location:p.location,notes:'Created from '+p.name})});let childId=Array.isArray(child)?child[0]?.id:child?.id;await api('/propagations',{method:'POST',body:JSON.stringify({plant_id:p.id,child_plant_id:childId,propagation_type:type,propagated_at:today(),notes:'Created '+name})});await api('/plants?id=eq.'+id,{method:'PATCH',body:JSON.stringify({propagation_count:Number(p.propagation_count||0)+1})});load()}catch(e){alert(e.message)}}function openExpense(){modal.innerHTML='<div class="box"><div class="modalHead"><h2>Add expense</h2><button class="close" onclick="close()">×</button></div><form onsubmit="saveExpense(event)"><div class="form"><div class="field"><label>Date</label><input id="ed" type="date" value="'+today()+'" required></div><div class="field"><label>Category</label><select id="ec"><option>Plants</option><option>Soil & Fertiliser</option><option>Pots</option><option>Packaging</option><option>Postage</option><option>Marketplace Fees</option><option>3D Printing</option><option>Electricity</option><option>Equipment</option><option>Other</option></select></div><div class="field"><label>Amount (£)</label><input id="ea" type="number" step="0.01" min="0" required></div><div class="field"><label>Description</label><input id="ex" placeholder="What was it for?"></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn" onclick="close()">Cancel</button><button class="btn primary">Save expense</button></div></form></div>';modal.classList.remove('hidden')}async function saveExpense(e){e.preventDefault();try{await api('/expenses',{method:'POST',body:JSON.stringify({expense_date:ed.value,category:ec.value,amount:Number(ea.value),description:ex.value.trim()})});close();load()}catch(e){alert('Could not save expense: '+e.message)}}load();
</script></body></html>
